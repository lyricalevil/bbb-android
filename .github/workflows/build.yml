      - name: Set app icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 2>/dev/null || true
          python3 -m pip install --quiet Pillow
          python3 - <<'PYEOF'
          from PIL import Image
          import os, glob
          candidates = glob.glob("www/icon/icon.png") or glob.glob("www/**/icon.png", recursive=True)
          if not candidates: raise SystemExit(1)
          src = candidates[0]; print("Using:", src)
          img = Image.open(src).convert("RGBA")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder, size in sizes.items():
              fp = os.path.join("android/app/src/main/res", folder)
              os.makedirs(fp, exist_ok=True)
              r = img.resize((size, size), Image.LANCZOS)
              r.save(os.path.join(fp, "ic_launcher.png"), "PNG")
              r.save(os.path.join(fp, "ic_launcher_round.png"), "PNG")
          print("Icons OK")
          PYEOF

      - name: Patch Android
        run: |
          python3 - <<'PYEOF'
          import re, glob
          p = 'android/app/src/main/AndroidManifest.xml'
          m = open(p, encoding='utf-8').read()
          if 'usesCleartextTraffic' not in m:
              m = m.replace('<application', '<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"', 1)
          if 'screenOrientation' not in m:
              m = m.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"', 1)
          open(p, 'w', encoding='utf-8').write(m)
          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          def fix(mt):
              b = mt.group(0)
              if 'windowFullscreen' in b: return b
              return b.replace('</style>', '    <item name="android:windowFullscreen">true</item>\n</style>')
          s = re.sub(r'<style\b[^>]*>.*?</style>', fix, s, flags=re.DOTALL)
          open(p, 'w', encoding='utf-8').write(s)
          paths = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          if paths:
              p = paths[0]
              pm = re.search(r'package\s+([\w.]+);', open(p, encoding='utf-8').read())
              pkg = pm.group(1) if pm else 'com.badbit.chblasters'
              java = 'package ' + pkg + ';\n\nimport android.graphics.Color;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\nimport android.view.WindowManager;\nimport androidx.core.view.WindowCompat;\nimport androidx.core.view.WindowInsetsCompat;\nimport androidx.core.view.WindowInsetsControllerCompat;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n    private final Handler handler = new Handler(Looper.getMainLooper());\n    private final Runnable hideRunnable = new Runnable() { @Override public void run() { goFullscreen(); } };\n    @Override public void onCreate(Bundle s) {\n        super.onCreate(s);\n        WindowCompat.setDecorFitsSystemWindows(getWindow(), false);\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;\n        getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);\n        getWindow().setStatusBarColor(Color.TRANSPARENT);\n        getWindow().setNavigationBarColor(Color.TRANSPARENT);\n        goFullscreen();\n        handler.postDelayed(hideRunnable, 50); handler.postDelayed(hideRunnable, 300);\n        handler.postDelayed(hideRunnable, 800); handler.postDelayed(hideRunnable, 1500); handler.postDelayed(hideRunnable, 3000);\n    }\n    @Override public void onWindowFocusChanged(boolean has) { super.onWindowFocusChanged(has); if (has) goFullscreen(); }\n    @Override public void onDestroy() { super.onDestroy(); handler.removeCallbacks(hideRunnable); }\n    private void goFullscreen() {\n        WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());\n        c.hide(WindowInsetsCompat.Type.systemBars());\n        c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);\n    }\n}\n'
              open(p, 'w', encoding='utf-8').write(java)
          print("Android OK")
          PYEOF

      - name: Build
        run: |
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bbb-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
