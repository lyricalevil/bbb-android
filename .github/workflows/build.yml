name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Download game
        run: |
          mkdir -p www
          wget -O game.zip "https://github.com/${{ github.repository }}/releases/download/v1/Bad.Bitch.Blasters.Build.23837192.zip"
          unzip -q game.zip -d www
          ls www/icon/ 2>&1 || true
          ls www/audio/bgm/ 2>&1 | head -5 || true

      - name: Scan BGM tracks
        run: |
          python3 - <<'PYEOF'
          import os, json
          bgm_dir = "www/audio/bgm"
          tracks = []
          if os.path.isdir(bgm_dir):
              for f in sorted(os.listdir(bgm_dir)):
                  if f.startswith('.') or not os.path.isfile(os.path.join(bgm_dir, f)): continue
                  name = f
                  for ext in ('.ogg_', '.ogg', '.m4a', '.mp3', '.wav'):
                      if name.endswith(ext):
                          name = name[:-len(ext)]; break
                  if name and name not in tracks: tracks.append(name)
          print("Found {} tracks".format(len(tracks)))
          with open("www/js/plugins/MusicPlayerTracks.js", "w", encoding="utf-8") as f:
              f.write("window.__musicTracks = " + json.dumps(tracks, ensure_ascii=False) + ";\n")
          PYEOF

      - name: Write ForceCanvas v7
        run: |
          PLUGINS_DIR=$(dirname "$(find www -name plugins.js 2>/dev/null | head -1)")
          cat > "$PLUGINS_DIR/plugins/ForceCanvas.js" <<'EOF'
          (() => {
              "use strict";
              try { PIXI.settings.SCALE_MODE = PIXI.SCALE_MODES.NEAREST; } catch (e) {}
              try { PIXI.settings.MIPMAP_TEXTURES = PIXI.MIPMAP_MODES.OFF; } catch (e) {}
              try { PIXI.settings.ROUND_PIXELS = true; } catch (e) {}
              try {
                  if (PIXI.BaseTexture && PIXI.BaseTexture.defaultOptions) {
                      PIXI.BaseTexture.defaultOptions.scaleMode = PIXI.SCALE_MODES.NEAREST;
                      PIXI.BaseTexture.defaultOptions.mipmap = PIXI.MIPMAP_MODES.OFF;
                  }
              } catch (e) {}
              try {
                  if (typeof Bitmap !== "undefined" && Bitmap.prototype._createBaseTexture) {
                      const o = Bitmap.prototype._createBaseTexture;
                      Bitmap.prototype._createBaseTexture = function (b) {
                          const bt = o.call(this, b);
                          try { bt.scaleMode = PIXI.SCALE_MODES.NEAREST; bt.mipmap = PIXI.MIPMAP_MODES.OFF; bt.update(); } catch (e) {}
                          return bt;
                      };
                  }
              } catch (e) {}
              function retrofit() {
                  try {
                      const c = PIXI.utils.TextureCache;
                      for (const k in c) {
                          const t = c[k];
                          if (t && t.baseTexture && t.baseTexture.scaleMode !== PIXI.SCALE_MODES.NEAREST) {
                              t.baseTexture.scaleMode = PIXI.SCALE_MODES.NEAREST;
                              t.baseTexture.update();
                          }
                      }
                  } catch (e) {}
              }
              setTimeout(retrofit, 500); setTimeout(retrofit, 1500);
              setTimeout(retrofit, 3000); setTimeout(retrofit, 6000);
              function fixLayout() {
                  const c = Graphics._canvas;
                  if (!c) return;
                  c.style.cssText += "position:absolute;left:0;top:0;width:100vw;height:100vh;object-fit:contain;transform:none;background:#000;display:block;";
                  document.body.style.cssText += "background:#000;margin:0;padding:0;overflow:hidden;";
              }
              try {
                  if (Graphics._updateCanvas) {
                      const o = Graphics._updateCanvas.bind(Graphics);
                      Graphics._updateCanvas = function () { o(); fixLayout(); };
                  }
              } catch (e) {}
              window.addEventListener("resize", fixLayout);
              setTimeout(fixLayout, 100); setTimeout(fixLayout, 1000);
              let speedOn = false;
              try { const r = localStorage.getItem("vc_cfg"); if (r) speedOn = JSON.parse(r).speedX2 === true; } catch (e) {}
              window.__vc_setSpeed = function (on) { speedOn = !!on; };
              try {
                  const oU = SceneManager.update.bind(SceneManager);
                  const oI = SceneManager.updateInputData.bind(SceneManager);
                  let skip = 0;
                  SceneManager.update = function (dt) { oU(dt); if (speedOn) { skip++; oU(dt); skip--; } };
                  SceneManager.updateInputData = function () { if (skip > 0) return; oI(); };
              } catch (e) {}
          })();
          EOF

      - name: Write VirtualControls v4
        run: |
          PLUGINS_DIR=$(dirname "$(find www -name plugins.js 2>/dev/null | head -1)")
          cat > "$PLUGINS_DIR/plugins/VirtualControls.js" <<'EOF'
          (() => {
              "use strict";
              const VERSION = 4;
              const BTN_IDS = ["up","down","left","right","ok","no","mnu"];
              const DEFAULT = {
                  _version: VERSION, opacity: 0.45, scale: 1.0, color: "#ffffff",
                  hideInMenu: false, hideInMessage: false, speedX2: false, positions: null,
                  perButton: { up:{scale:null,color:null,opacity:null,label:null}, down:{scale:null,color:null,opacity:null,label:null}, left:{scale:null,color:null,opacity:null,label:null}, right:{scale:null,color:null,opacity:null,label:null}, ok:{scale:null,color:null,opacity:null,label:null}, no:{scale:null,color:null,opacity:null,label:null}, mnu:{scale:null,color:null,opacity:null,label:null} },
                  player: { x: null, y: null, panelX: null, panelY: null, scale: 1.0, opacity: 0.92, color: "#14141e", accent: "#5078c8" }
              };
              function loadCfg() {
                  try {
                      const raw = localStorage.getItem("vc_cfg");
                      if (raw) {
                          const p = JSON.parse(raw);
                          if (p._version !== VERSION) return JSON.parse(JSON.stringify(DEFAULT));
                          const m = Object.assign({}, DEFAULT, p);
                          m.perButton = Object.assign({}, DEFAULT.perButton);
                          BTN_IDS.forEach(id => m.perButton[id] = Object.assign({}, DEFAULT.perButton[id], (p.perButton && p.perButton[id]) || {}));
                          m.player = Object.assign({}, DEFAULT.player, p.player || {});
                          return m;
                      }
                  } catch (e) {}
                  return JSON.parse(JSON.stringify(DEFAULT));
              }
              function saveCfg() { CFG._version = VERSION; try { localStorage.setItem("vc_cfg", JSON.stringify(CFG)); } catch (e) {} }
              let CFG = loadCfg();
              window.__vc_cfg = CFG;
              let root = null, editMode = false, panelOpen = false, buttons = {}, settingsBtn = null, panel = null;
              if (window.__vc_setSpeed) window.__vc_setSpeed(CFG.speedX2);
              function btnProp(id, prop) { const pb = CFG.perButton[id] || {}; return pb[prop] != null ? pb[prop] : CFG[prop]; }
              function tryHideStatusBar() {
                  try {
                      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
                          window.Capacitor.Plugins.StatusBar.setOverlaysWebView({ overlay: true }).catch(()=>{});
                          window.Capacitor.Plugins.StatusBar.hide().catch(()=>{});
                      }
                  } catch (e) {}
              }
              tryHideStatusBar(); setTimeout(tryHideStatusBar, 500); setTimeout(tryHideStatusBar, 2000); setTimeout(tryHideStatusBar, 5000);
              function attachTap(el, cb) {
                  let sx = 0, sy = 0, st = 0, moved = false;
                  el.addEventListener("touchstart", (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); moved = false; }, { passive: true });
                  el.addEventListener("touchmove", (e) => { const t = e.touches[0]; if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) moved = true; }, { passive: true });
                  el.addEventListener("touchend", (e) => { if (moved || Date.now() - st > 500) return; e.preventDefault(); e.stopPropagation(); cb(); }, { passive: false });
                  el.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); cb(); });
              }
              function attachTapFast(el, cb) {
                  let last = 0;
                  const h = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } const n = Date.now(); if (n - last < 100) return; last = n; cb(); };
                  el.addEventListener("touchstart", h, { passive: false });
                  el.addEventListener("mousedown", h);
              }
              function setKey(key, on) {
                  if (key === "mnu") { if (on && SceneManager._scene instanceof Scene_Map && !$gameMessage.isBusy()) SceneManager._scene.callMenu(); return; }
                  const map = { ok: "ok", no: "cancel", up: "up", down: "down", left: "left", right: "right" };
                  const ik = map[key]; if (!ik) return;
                  Input._currentState[ik] = on;
                  if (on) { Input._latestButton = ik; Input._pressedTime = 0; }
              }
              function parseColor(hex) {
                  hex = (hex || "#ffffff").replace('#', '');
                  if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
                  return { r: parseInt(hex.slice(0,2),16), g: parseInt(hex.slice(2,4),16), b: parseInt(hex.slice(4,6),16) };
              }
              function rgba(hex, a) { const c = parseColor(hex); return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")"; }
              function isLight(hex) { const c = parseColor(hex); return (c.r * 0.299 + c.g * 0.587 + c.b * 0.114) > 150; }
              function makeButton(id, baseLabel, baseSize, circular) {
                  const el = document.createElement("div");
                  el.dataset.vcid = id;
                  el.style.cssText = "position:fixed;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;font-family:'Courier New',monospace;font-weight:bold;z-index:2147483646;border-radius:" + (circular ? "50%" : "10px") + ";";
                  const start = (e) => { e.preventDefault(); e.stopPropagation(); if (editMode) { startDrag(e, el, id); return; } setKey(id, true); };
                  const end = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } if (editMode) return; setKey(id, false); };
                  el.addEventListener("touchstart", start, { passive: false });
                  el.addEventListener("touchend", end, { passive: false });
                  el.addEventListener("touchcancel", end);
                  el.addEventListener("mousedown", start);
                  el.addEventListener("mouseup", end);
                  el.addEventListener("mouseleave", end);
                  el._baseSize = baseSize; el._defaultLabel = baseLabel;
                  return el;
              }
              function updateButtonStyle(el, id) {
                  const sz = Math.round((el._baseSize || 68) * btnProp(id, "scale"));
                  const col = btnProp(id, "color"), op = btnProp(id, "opacity");
                  el.style.width = sz + "px"; el.style.height = sz + "px";
                  el.style.background = rgba(col, op);
                  el.style.border = "2px solid " + rgba(col, Math.min(1, op + 0.3));
                  el.style.color = isLight(col) ? "#000" : "#fff";
                  el.style.fontSize = Math.round(sz * 0.35) + "px";
                  el.style.outline = editMode ? "2px dashed #ff0" : "none";
                  el.textContent = (CFG.perButton[id] && CFG.perButton[id].label) || el._defaultLabel;
              }
              let dragState = null;
              function startDrag(e, el, id) {
                  const t = (e.touches && e.touches[0]) || e;
                  const r = el.getBoundingClientRect();
                  dragState = { el, id, ox: t.clientX - r.left, oy: t.clientY - r.top };
                  e.preventDefault();
              }
              document.addEventListener("touchmove", (e) => {
                  if (!dragState) return;
                  const t = e.touches[0];
                  dragState.el.style.left = (t.clientX - dragState.ox) + "px";
                  dragState.el.style.top = (t.clientY - dragState.oy) + "px";
                  e.preventDefault();
              }, { passive: false });
              document.addEventListener("mousemove", (e) => {
                  if (!dragState) return;
                  dragState.el.style.left = (e.clientX - dragState.ox) + "px";
                  dragState.el.style.top = (e.clientY - dragState.oy) + "px";
              });
              function endDrag() {
                  if (!dragState) return;
                  const r = dragState.el.getBoundingClientRect();
                  if (!CFG.positions) CFG.positions = {};
                  CFG.positions[dragState.id] = { x: r.left / innerWidth * 100, y: r.top / innerHeight * 100 };
                  saveCfg(); dragState = null;
              }
              document.addEventListener("touchend", endDrag);
              document.addEventListener("mouseup", endDrag);
              function getPos(id) {
                  if (CFG.positions && CFG.positions[id]) return CFG.positions[id];
                  const dpad = 150, as = dpad / 3, mg = 30, btn = 68;
                  const bL = mg / innerWidth * 100, bT = (innerHeight - (dpad + mg)) / innerHeight * 100;
                  const aL = as / innerWidth * 100, aT = as / innerHeight * 100;
                  const pL = (innerWidth - mg - btn) / innerWidth * 100, pT = (innerHeight - mg - btn) / innerHeight * 100;
                  const sL = (btn + 14) / innerWidth * 100;
                  switch (id) {
                      case "up": return { x: bL + aL, y: bT };
                      case "down": return { x: bL + aL, y: bT + aT * 2 };
                      case "left": return { x: bL, y: bT + aT };
                      case "right": return { x: bL + aL * 2, y: bT + aT };
                      case "ok": return { x: pL, y: pT };
                      case "no": return { x: pL - sL, y: pT };
                      case "mnu": return { x: pL - sL * 2, y: pT };
                  }
                  return { x: 50, y: 50 };
              }
              function applyPos(el, id) { const p = getPos(id); el.style.left = p.x + "%"; el.style.top = p.y + "%"; }
              function applyAllPositions() { for (const id in buttons) applyPos(buttons[id], id); }
              function updateVisibility() {
                  if (!root) return;
                  const s = SceneManager._scene; if (!s) return;
                  let d = true, a = true, k = true;
                  const isGame = (s instanceof Scene_Map) || (s instanceof Scene_Battle);
                  if (!isGame && CFG.hideInMenu) { d = false; a = false; }
                  if (s instanceof Scene_Map && CFG.hideInMessage && $gameMessage.isBusy()) { d = false; a = false; k = false; }
                  ["up","down","left","right"].forEach(id => { if (buttons[id]) buttons[id].style.display = d ? "flex" : "none"; });
                  ["no","mnu"].forEach(id => { if (buttons[id]) buttons[id].style.display = a ? "flex" : "none"; });
                  if (buttons["ok"]) buttons["ok"].style.display = k ? "flex" : "none";
              }
              function makeSection(title, expanded) {
                  const w = document.createElement("div");
                  w.style.cssText = "margin-bottom:10px;border:1px solid #333;border-radius:8px;overflow:hidden;";
                  const h = document.createElement("div");
                  h.style.cssText = "background:#252540;padding:10px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;font-weight:bold;font-size:14px;display:flex;justify-content:space-between;align-items:center;";
                  h.innerHTML = "<span>" + title + "</span><span>" + (expanded ? "▼" : "▶") + "</span>";
                  const b = document.createElement("div");
                  b.style.cssText = "padding:12px;display:" + (expanded ? "block" : "none") + ";background:#1a1a28;";
                  let open = expanded;
                  attachTap(h, () => { open = !open; b.style.display = open ? "block" : "none"; h.querySelector("span:last-child").textContent = open ? "▼" : "▶"; });
                  w.appendChild(h); w.appendChild(b);
                  return { wrap: w, body: b };
              }
              function makeSlider(parent, label, value, min, max, step, onChange) {
                  const r = document.createElement("div");
                  r.style.cssText = "margin-bottom:10px;";
                  const lr = document.createElement("div");
                  lr.style.cssText = "display:flex;justify-content:space-between;font-size:12px;color:#aaa;margin-bottom:4px;";
                  const l = document.createElement("span"); l.textContent = label;
                  const v = document.createElement("span"); v.textContent = value;
                  lr.appendChild(l); lr.appendChild(v); r.appendChild(lr);
                  const inp = document.createElement("input");
                  inp.type = "range"; inp.min = min; inp.max = max; inp.step = step; inp.value = value;
                  inp.style.cssText = "width:100%;touch-action:manipulation;";
                  inp.addEventListener("input", () => { v.textContent = inp.value; onChange(parseFloat(inp.value)); });
                  inp.addEventListener("touchstart", (e) => e.stopPropagation(), { passive: true });
                  r.appendChild(inp); parent.appendChild(r);
              }
              function makeColorRow(parent, label, current, onChange) {
                  const r = document.createElement("div");
                  r.style.cssText = "margin-bottom:10px;";
                  const l = document.createElement("div"); l.textContent = label; l.style.cssText = "font-size:12px;color:#aaa;margin-bottom:4px;";
                  r.appendChild(l);
                  const w = document.createElement("div"); w.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;";
                  ["#ffffff","#202020","#d04040","#4060d0","#40a040","#d0a020","#c040a0","#40c0c0"].forEach(hex => {
                      const cb = document.createElement("div");
                      cb.style.cssText = "width:30px;height:30px;border-radius:50%;background:" + hex + ";cursor:pointer;border:3px solid " + (current === hex ? "#fff" : "transparent") + ";touch-action:manipulation;";
                      attachTap(cb, () => { onChange(hex); Array.from(w.children).forEach(c => c.style.border = "3px solid transparent"); cb.style.border = "3px solid #fff"; });
                      w.appendChild(cb);
                  });
                  r.appendChild(w); parent.appendChild(r);
              }
              function makeToggle(parent, label, value, onChange) {
                  const r = document.createElement("div");
                  r.style.cssText = "margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;";
                  const l = document.createElement("span"); l.textContent = label; l.style.cssText = "font-size:13px;";
                  r.appendChild(l);
                  const b = document.createElement("div");
                  b.style.cssText = "padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;touch-action:manipulation;user-select:none;";
                  function refresh() { b.textContent = value ? "ВКЛ" : "ВЫКЛ"; b.style.background = value ? "#40a040" : "#606060"; }
                  refresh();
                  attachTap(b, () => { value = !value; refresh(); onChange(value); });
                  r.appendChild(b); parent.appendChild(r);
              }
              function makeActionBtn(parent, label, bg, cb) {
                  const b = document.createElement("div");
                  b.textContent = label;
                  b.style.cssText = "padding:10px;border-radius:6px;cursor:pointer;text-align:center;font-size:14px;font-weight:bold;margin-bottom:8px;touch-action:manipulation;user-select:none;background:" + (bg || "#4060d0") + ";color:#fff;";
                  attachTap(b, cb); parent.appendChild(b);
              }
              let editingButton = "ok";
              function refreshAll() { for (const id in buttons) updateButtonStyle(buttons[id], id); if (settingsBtn) updateSettingsBtnStyle(); }
              function updateSettingsBtnStyle() {
                  const s = 40, op = CFG.opacity, col = CFG.color;
                  settingsBtn.style.width = s + "px"; settingsBtn.style.height = s + "px"; settingsBtn.style.fontSize = "20px";
                  settingsBtn.style.background = rgba(col, Math.min(0.8, op + 0.2));
                  settingsBtn.style.color = isLight(col) ? "#000" : "#fff";
              }
              function buildPanel() {
                  const p = document.createElement("div");
                  p.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,560px);max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(20,20,30,0.97);color:#fff;font-family:Arial,sans-serif;padding:16px 16px 0 16px;border-radius:12px;z-index:2147483647;box-shadow:0 4px 24px rgba(0,0,0,0.9);display:none;touch-action:pan-y;";
                  p.addEventListener("touchstart", (e) => e.stopPropagation(), { passive: true });
                  const title = document.createElement("div");
                  title.textContent = "Настройки v4";
                  title.style.cssText = "font-size:18px;font-weight:bold;margin-bottom:14px;text-align:center;";
                  p.appendChild(title);
                  const secB = makeSection("Кнопки", true);
                  p.appendChild(secB.wrap);
                  const chips = document.createElement("div");
                  chips.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;";
                  BTN_IDS.forEach(id => {
                      const chip = document.createElement("div");
                      chip.textContent = id;
                      chip.style.cssText = "padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;touch-action:manipulation;user-select:none;background:" + (editingButton === id ? "#4060d0" : "#303045") + ";color:#fff;";
                      attachTap(chip, () => { editingButton = id; Array.from(chips.children).forEach(c => c.style.background = c.textContent === editingButton ? "#4060d0" : "#303045"); refreshButtonEditor(); });
                      chips.appendChild(chip);
                  });
                  secB.body.appendChild(chips);
                  const eb = document.createElement("div");
                  secB.body.appendChild(eb);
                  function refreshButtonEditor() {
                      eb.innerHTML = "";
                      const id = editingButton, pb = CFG.perButton[id] || {};
                      makeSlider(eb, "Размер", pb.scale != null ? Math.round(pb.scale * 100) : Math.round(CFG.scale * 100), 50, 200, 5, (v) => { CFG.perButton[id].scale = v / 100; saveCfg(); updateButtonStyle(buttons[id], id); applyPos(buttons[id], id); });
                      makeSlider(eb, "Прозрачность", pb.opacity != null ? Math.round(pb.opacity * 100) : Math.round(CFG.opacity * 100), 10, 100, 5, (v) => { CFG.perButton[id].opacity = v / 100; saveCfg(); updateButtonStyle(buttons[id], id); });
                      makeColorRow(eb, "Цвет", pb.color || CFG.color, (hex) => { CFG.perButton[id].color = hex; saveCfg(); updateButtonStyle(buttons[id], id); });
                      const lr = document.createElement("div");
                      lr.style.cssText = "margin-bottom:10px;";
                      const lt = document.createElement("div");
                      lt.textContent = "Текст кнопки"; lt.style.cssText = "font-size:12px;color:#aaa;margin-bottom:4px;";
                      lr.appendChild(lt);
                      const li = document.createElement("input");
                      li.type = "text"; li.value = pb.label || buttons[id]._defaultLabel;
                      li.style.cssText = "width:100%;padding:8px;border-radius:6px;border:1px solid #444;background:#252540;color:#fff;font-size:14px;box-sizing:border-box;touch-action:manipulation;";
                      li.addEventListener("input", () => { CFG.perButton[id].label = li.value || null; saveCfg(); updateButtonStyle(buttons[id], id); });
                      li.addEventListener("touchstart", (e) => e.stopPropagation(), { passive: true });
                      lr.appendChild(li); eb.appendChild(lr);
                      makeActionBtn(eb, "Сбросить эту кнопку", "#a04040", () => { CFG.perButton[id] = { scale: null, color: null, opacity: null, label: null }; if (CFG.positions) delete CFG.positions[id]; saveCfg(); updateButtonStyle(buttons[id], id); applyPos(buttons[id], id); refreshButtonEditor(); });
                  }
                  refreshButtonEditor();
                  const secP = makeSection("Плеер", false);
                  p.appendChild(secP.wrap);
                  makeSlider(secP.body, "Размер", Math.round(CFG.player.scale * 100), 70, 160, 5, (v) => { CFG.player.scale = v / 100; saveCfg(); if (window.__mp_applyCfg) window.__mp_applyCfg(); });
                  makeSlider(secP.body, "Прозрачность", Math.round(CFG.player.opacity * 100), 30, 100, 5, (v) => { CFG.player.opacity = v / 100; saveCfg(); if (window.__mp_applyCfg) window.__mp_applyCfg(); });
                  makeColorRow(secP.body, "Цвет фона", CFG.player.color, (hex) => { CFG.player.color = hex; saveCfg(); if (window.__mp_applyCfg) window.__mp_applyCfg(); });
                  makeColorRow(secP.body, "Акцент", CFG.player.accent, (hex) => { CFG.player.accent = hex; saveCfg(); if (window.__mp_applyCfg) window.__mp_applyCfg(); });
                  makeActionBtn(secP.body, "Сбросить плеер и позицию", "#a04040", () => { CFG.player = Object.assign({}, DEFAULT.player); saveCfg(); if (window.__mp_applyCfg) window.__mp_applyCfg(); });
                  const secG = makeSection("Общие", false);
                  p.appendChild(secG.wrap);
                  makeToggle(secG.body, "Скрывать в меню", CFG.hideInMenu, (v) => { CFG.hideInMenu = v; saveCfg(); });
