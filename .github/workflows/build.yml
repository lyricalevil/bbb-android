                  };
                  title.style.touchAction = "none"; title.style.cursor = "move";
                  title.addEventListener("touchstart", start, { passive: false });
                  title.addEventListener("touchmove", move, { passive: false });
                  title.addEventListener("touchend", end, { passive: false });
                  title.addEventListener("mousedown", start);
                  title.addEventListener("mousemove", move);
                  title.addEventListener("mouseup", end);
              }

              function attachSeek(bar, fill, thumb) {
                  const getPct = (e) => {
                      const t = (e.touches && e.touches[0]) || e;
                      const r = bar.getBoundingClientRect();
                      return Math.max(0, Math.min(1, (t.clientX - r.left) / r.width));
                  };
                  const start = (e) => {
                      seeking = true;
                      const p = getPct(e);
                      fill.style.width = (p * 100) + "%";
                      if (thumb) thumb.style.left = (p * 100) + "%";
                      if (e.cancelable) e.preventDefault();
                  };
                  const move = (e) => {
                      if (!seeking) return;
                      const p = getPct(e);
                      fill.style.width = (p * 100) + "%";
                      if (thumb) thumb.style.left = (p * 100) + "%";
                      if (e.cancelable) e.preventDefault();
                  };
                  const end = (e) => {
                      if (!seeking) return;
                      seeking = false;
                      const p = getPct(e);
                      seekTo(p);
                      if (panel) {
                          panel._fill.style.width = (p * 100) + "%";
                          if (panel._thumb) panel._thumb.style.left = (p * 100) + "%";
                      }
                  };
                  bar.addEventListener("touchstart", start, { passive: false });
                  bar.addEventListener("touchmove", move, { passive: false });
                  bar.addEventListener("touchend", end, { passive: false });
                  bar.addEventListener("mousedown", start);
                  bar.addEventListener("mousemove", move);
                  bar.addEventListener("mouseup", end);
              }

              function applyCfg() {
                  const p = getPlayerCfg();
                  if (!root) return;
                  const sz = Math.round(44 * (p.scale || 1));
                  root.style.width = sz + "px"; root.style.height = sz + "px";
                  root.style.fontSize = Math.round(sz * 0.55) + "px";
                  root.style.background = hexA(p.accent || "#5078c8", 0.85);
                  if (p.x != null) root.style.left = p.x + "px";
                  if (p.y != null) root.style.top = p.y + "px";
                  if (panel) {
                      const ps = p.scale || 1;
                      panel.style.transform = "scale(" + ps + ")";
                      panel.style.transformOrigin = "top left";
                      panel.style.background = hexA(p.color || "#14141e", p.opacity || 0.92);
                      if (p.panelX != null) panel.style.left = p.panelX + "px";
                      if (p.panelY != null) panel.style.top = p.panelY + "px";
                  }
