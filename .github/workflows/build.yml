name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download game
        run: |
          mkdir -p www
          wget -O game.zip "https://github.com/${{ github.repository }}/releases/download/v1/Bad.Bitch.Blasters.Build.23837192.zip"
          unzip -q game.zip -d www
          if [ ! -f www/index.html ]; then
            inner=$(find www -maxdepth 2 -name index.html | head -1 | xargs dirname 2>/dev/null || true)
            if [ -n "$inner" ] && [ "$inner" != "www" ]; then
              shopt -s dotglob
              mv "$inner"/* www/
              rmdir "$inner" || true
            fi
          fi

      - name: Patch rpg_core.js to force Canvas renderer
        run: |
          python3 - <<'PYEOF'
          p = 'www/js/rpg_core.js'
          c = open(p, encoding='utf-8').read()
          orig = c

          # 1. Force rendererType = canvas
          c = c.replace("this._rendererType = type || 'auto';",
                        "this._rendererType = 'canvas';")

          # 2. Replace autoDetectRenderer with CanvasRenderer (in _createRenderer default branch)
          c = c.replace("this._renderer = PIXI.autoDetectRenderer(width, height, options);",
                        "this._renderer = new PIXI.CanvasRenderer(width, height, options);")

          # 3. Also patch the catch fallback to ensure Canvas
          c = c.replace(
              "catch (e) {\n            this._renderer = new PIXI.CanvasRenderer(width, height, options);\n        }",
              "catch (e) {\n            console.error('[rpg_core patch] renderer failed:', e);\n            this._renderer = new PIXI.CanvasRenderer(width, height, options);\n        }")

          open(p, 'w', encoding='utf-8').write(c)
          print('rpg_core changed:', c != orig)
          print('rendererType=canvas present:', "this._rendererType = 'canvas';" in c)
          print('CanvasRenderer in default branch:', 'this._renderer = new PIXI.CanvasRenderer(width, height, options);' in c)
          PYEOF

      - name: Disable PixelateImageRendering in VisuStella CoreEngine
        run: |
          python3 - <<'PYEOF'
          p = 'www/js/plugins.js'
          c = open(p, encoding='utf-8').read()
          orig = c
          c = c.replace('"PixelateImageRendering:eval":"true"',
                        '"PixelateImageRendering:eval":"false"')
          open(p, 'w', encoding='utf-8').write(c)
          print('PixelateImageRendering disabled:', c != orig)
          PYEOF

      - name: Write VirtualControls plugin
        run: |
          cat > www/js/plugins/VirtualControls.js <<'EOF'
          (() => {
              "use strict";
              const CFG = { dpadSize: 150, dpadMargin: 30, btnSize: 68, btnMargin: 40, btnGap: 14, opacity: 0.45 };
              let root = null;
              function setKey(key, on) {
                  if (key === "menu") {
                      if (on && SceneManager._scene instanceof Scene_Map && !$gameMessage.isBusy()) {
                          SceneManager._scene.callMenu();
                      }
                      return;
                  }
                  Input._currentState[key] = on;
                  if (on) { Input._latestButton = key; Input._pressedTime = 0; }
              }
              function makeEl(id, label, style) {
                  const el = document.createElement("div");
                  el.textContent = label;
                  el.style.cssText = "position:fixed;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;font-family:Arial,sans-serif;font-weight:bold;color:#fff;z-index:2147483647;border-radius:50%;" + style;
                  const start = (e) => { e.preventDefault(); e.stopPropagation(); setKey(id, true); };
                  const end = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } setKey(id, false); };
                  el.addEventListener("touchstart", start, { passive: false });
                  el.addEventListener("touchend", end, { passive: false });
                  el.addEventListener("touchcancel", end);
                  el.addEventListener("mousedown", start);
                  el.addEventListener("mouseup", end);
                  el.addEventListener("mouseleave", end);
                  return el;
              }
              function build() {
                  if (root) return;
                  root = document.createElement("div");
                  root.id = "vc-root";
                  root.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;z-index:2147483647;";
                  document.body.appendChild(root);
                  const vw = innerWidth, vh = innerHeight;
                  const ds = CFG.dpadSize, dm = CFG.dpadMargin;
                  const as = ds / 3, dx = dm, dy = vh - ds - dm;
                  const arrowStyle = "background:rgba(255,255,255," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);border-radius:10px;font-size:24px;";
                  const add = (id, label, left, top, size, style) => {
                      const el = makeEl(id, label, style + "left:" + left + "px;top:" + top + "px;width:" + size + "px;height:" + size + "px;");
                      root.appendChild(el);
                  };
                  add("up", "▲", dx + as, dy, as, arrowStyle);
                  add("down", "▼", dx + as, dy + as * 2, as, arrowStyle);
                  add("left", "◀", dx, dy + as, as, arrowStyle);
                  add("right", "▶", dx + as * 2, dy + as, as, arrowStyle);
                  const bs = CFG.btnSize, bm = CFG.btnMargin, bg = CFG.btnGap;
                  const okStyle = "background:rgba(80,200,80," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  const cancelStyle = "background:rgba(200,80,80," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  const menuStyle = "background:rgba(80,80,200," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:26px;";
                  const dashStyle = "background:rgba(220,180,40," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  add("ok", "OK", vw - bm - bs, vh - bm - bs, bs, okStyle);
                  add("cancel", "X", vw - bm - bs * 2 - bg, vh - bm - bs, bs, cancelStyle);
                  add("shift", "⇧", vw - bm - bs * 3 - bg * 2, vh - bm - bs, bs, dashStyle);
                  add("menu", "≡", vw - bm - bs, vh - bm - bs * 2 - bg, bs, menuStyle);
              }
              window.addEventListener("load", () => setTimeout(build, 200));
              let rt = null;
              window.addEventListener("resize", () => {
                  clearTimeout(rt);
                  rt = setTimeout(() => { if (root) { root.remove(); root = null; } build(); }, 300);
              });
          })();
          EOF

      - name: Patch plugins.js (enable VirtualControls, disable Greenworks)
        run: |
          python3 - <<'PYEOF'
          import re
          p = 'www/js/plugins.js'
          c = open(p, encoding='utf-8').read()
          if '"VirtualControls"' not in c:
              i = c.rfind('];')
              if i != -1:
                  c = c[:i] + ',{"name":"VirtualControls","status":true,"description":"","parameters":{}}' + c[i:]
          else:
              c = re.sub(r'("name"\s*:\s*"VirtualControls"\s*,\s*"status"\s*:\s*)false', r'\1true', c)
          c = re.sub(r'("name"\s*:\s*"OrangeGreenworks"\s*,\s*"status"\s*:\s*)true', r'\1false', c)
          open(p, 'w', encoding='utf-8').write(c)
          for n in ("VirtualControls", "OrangeGreenworks"):
              m = re.search(r'"name"\s*:\s*"' + n + r'"\s*,\s*"status"\s*:\s*(\w+)', c)
              print(n + ": " + (m.group(1) if m else "NOT FOUND"))
          PYEOF

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init and add Android
        run: |
          npx cap init "Bad Bitch Blasters" "com.badbit.chblasters" --web-dir www
          npx cap add android

      - name: Patch Android (landscape + modern fullscreen + immersive)
        run: |
          python3 - <<'PYEOF'
          import re, glob

          # --- Manifest: cleartext + landscape ---
          p = 'android/app/src/main/AndroidManifest.xml'
          m = open(p, encoding='utf-8').read()
          if 'usesCleartextTraffic' not in m:
              m = m.replace('<application', '<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"', 1)
          if 'screenOrientation' not in m:
              m = m.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"', 1)
          open(p, 'w', encoding='utf-8').write(m)
          print('manifest done')

          # --- styles.xml: fullscreen in every style + edge-to-edge ---
          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          def fix(mt):
              b = mt.group(0)
              if 'windowFullscreen' in b:
                  return b
              items = (
                  '    <item name="android:windowFullscreen">true</item>\n'
                  '    <item name="android:windowContentOverlay">@null</item>\n'
                  '    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n'
                  '    <item name="android:windowTranslucentStatus">true</item>\n'
                  '    <item name="android:windowTranslucentNavigation">true</item>\n'
                  '    <item name="android:windowDrawsSystemBarBackgrounds">true</item>\n'
              )
              return b.replace('</style>', items + '</style>')
          s = re.sub(r'<style\b[^>]*>.*?</style>', fix, s, flags=re.DOTALL)
          open(p, 'w', encoding='utf-8').write(s)
          print('styles: fullscreen in', s.count('windowFullscreen'), 'theme(s)')
          print('styles preview:', s[:300].replace('\n',' '))

          # --- MainActivity: modern WindowInsetsController ---
          paths = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          if paths:
              p = paths[0]
              old = open(p, encoding='utf-8').read()
              pm = re.search(r'package\s+([\w.]+);', old)
              pkg = pm.group(1) if pm else 'com.badbit.chblasters'
              java = (
                'package ' + pkg + ';\n\n'
                'import android.os.Build;\n'
                'import android.os.Bundle;\n'
                'import android.view.View;\n'
                'import android.view.WindowInsets;\n'
                'import android.view.WindowInsetsController;\n'
                'import android.view.WindowManager;\n'
                'import com.getcapacitor.BridgeActivity;\n\n'
                'public class MainActivity extends BridgeActivity {\n'
                '    @Override\n'
                '    public void onCreate(Bundle s) {\n'
                '        super.onCreate(s);\n'
                '        goFullscreen();\n'
                '    }\n\n'
                '    @Override\n'
                '    public void onResume() {\n'
                '        super.onResume();\n'
                '        goFullscreen();\n'
                '    }\n\n'
                '    @Override\n'
                '    public void onWindowFocusChanged(boolean has) {\n'
                '        super.onWindowFocusChanged(has);\n'
                '        if (has) goFullscreen();\n'
                '    }\n\n'
                '    private void goFullscreen() {\n'
                '        getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);\n'
                '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n'
                '            WindowInsetsController c = getWindow().getInsetsController();\n'
                '            if (c != null) {\n'
                '                c.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());\n'
                '                c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);\n'
                '            }\n'
                '        }\n'
                '        getWindow().getDecorView().setSystemUiVisibility(\n'
                '            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY\n'
                '            | View.SYSTEM_UI_FLAG_LAYOUT_STABLE\n'
                '            | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION\n'
                '            | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN\n'
                '            | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION\n'
                '            | View.SYSTEM_UI_FLAG_FULLSCREEN);\n'
                '    }\n'
                '}\n'
              )
              open(p, 'w', encoding='utf-8').write(java)
              print('MainActivity rewritten:', p)
          PYEOF

      - name: Build
        run: |
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bbb-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
