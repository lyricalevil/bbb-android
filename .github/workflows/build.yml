name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download game
        run: |
          mkdir -p www
          wget -O game.zip "https://github.com/${{ github.repository }}/releases/download/v1/Bad.Bitch.Blasters.Build.23837192.zip"
          unzip -q game.zip -d www
          echo "=== diagnostics: _createRenderer in rmmz_core ==="
          grep -n "_createRenderer" www/js/rmmz_core.js 2>&1 | head -10 || true
          echo "=== diagnostics: rendererType in rmmz_core ==="
          grep -n "rendererType" www/js/rmmz_core.js 2>&1 | head -10 || true
          echo "=== diagnostics: PIXI.Renderer usage in rmmz_core ==="
          grep -n "PIXI.Renderer\|PIXI.autoDetectRenderer" www/js/rmmz_core.js 2>&1 | head -10 || true
          echo "=== diagnostics: file size / line count ==="
          wc -c www/js/rmmz_core.js
          wc -l www/js/rmmz_core.js

      - name: Write ForceCanvas v3 (aggressive override + visual indicator)
        run: |
          PLUGINS_DIR=$(dirname "$(find www -name plugins.js 2>/dev/null | head -1)")
          cat > "$PLUGINS_DIR/plugins/ForceCanvas.js" <<'EOF'
          (() => {
              "use strict";

              function log(m) { console.log("[ForceCanvas] " + m); }
              function err(m) { console.error("[ForceCanvas] " + m); }

              log("Plugin loaded. PIXI version: " + (PIXI.VERSION || "?"));
              log("PIXI.Renderer: " + typeof PIXI.Renderer);
              log("PIXI.CanvasRenderer: " + typeof PIXI.CanvasRenderer);
              log("PIXI.autoDetectRenderer: " + typeof PIXI.autoDetectRenderer);

              // ---- 1) Override PIXI.Renderer constructor via getter ----
              try {
                  if (PIXI.CanvasRenderer) {
                      const CanvasR = PIXI.CanvasRenderer;

                      // Force factory function
                      PIXI.Renderer = function (w, h, o) {
                          log("PIXI.Renderer() intercepted -> CanvasRenderer");
                          return new CanvasR(w, h, o);
                      };

                      if (PIXI.autoDetectRenderer) {
                          PIXI.autoDetectRenderer = function (w, h, o) {
                              log("autoDetectRenderer() intercepted -> CanvasRenderer");
                              return new CanvasR(w, h, o);
                          };
                      }

                      log("PIXI overrides installed");
                  } else {
                      err("PIXI.CanvasRenderer unavailable");
                  }
              } catch (e) { err("PIXI override failed: " + e); }

              // ---- 2) Patch Graphics.initialize to force 'canvas' type early ----
              try {
                  if (typeof Graphics !== "undefined" && Graphics.initialize) {
                      const origInit = Graphics.initialize;
                      Graphics.initialize = function (width, height, type) {
                          log("Graphics.initialize called with type=" + type + ", forcing canvas");
                          return origInit.call(this, width, height, "canvas");
                      };
                      log("Graphics.initialize patched");
                  }
              } catch (e) { err("Graphics.initialize patch failed: " + e); }

              // ---- 3) Patch Graphics._createRenderer as last resort ----
              try {
                  if (typeof Graphics !== "undefined") {
                      const orig = Graphics._createRenderer;
                      Graphics._createRenderer = function () {
                          PIXI.dontSayHello = true;
                          try {
                              this._renderer = new PIXI.CanvasRenderer(this._width, this._height, { view: this._canvas });
                              log("_createRenderer -> Canvas, type=" + this._renderer.type);
                          } catch (e) {
                              err("_createRenderer Canvas failed: " + e);
                              if (orig) orig.call(this);
                          }
                      };
                      log("Graphics._createRenderer patched");
                  }
              } catch (e) { err("_createRenderer patch failed: " + e); }

              // ---- 4) Visual indicator (visible 15 sec after start) ----
              window.addEventListener("load", () => {
                  setTimeout(() => {
                      try {
                          const r = (typeof Graphics !== "undefined") ? Graphics._renderer : null;
                          let typeStr = "none", color = "#a00";
                          if (r) {
                              if (r.type === 1) { typeStr = "Canvas"; color = "#0a0"; }
                              else if (r.type === 2) { typeStr = "WebGL"; color = "#a00"; }
                              else { typeStr = "type=" + r.type; color = "#a80"; }
                          }
                          const div = document.createElement("div");
                          div.textContent = "R: " + typeStr;
                          div.style.cssText = "position:fixed;top:8px;right:8px;padding:10px 18px;background:" + color + ";color:#fff;font-family:monospace;font-size:22px;font-weight:bold;z-index:2147483647;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.6);";
                          document.body.appendChild(div);
                          setTimeout(() => div.remove(), 15000);
                          log("INDICATOR: " + typeStr);
                      } catch (e) { err("indicator failed: " + e); }
                  }, 2500);
              });
          })();
          EOF

      - name: Write VirtualControls plugin (with StatusBar hide)
        run: |
          PLUGINS_DIR=$(dirname "$(find www -name plugins.js 2>/dev/null | head -1)")
          cat > "$PLUGINS_DIR/plugins/VirtualControls.js" <<'EOF'
          (() => {
              "use strict";
              const CFG = { dpadSize: 150, dpadMargin: 30, btnSize: 68, btnMargin: 40, btnGap: 14, opacity: 0.45 };
              let root = null;
              function tryHideStatusBar() {
                  try {
                      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
                          window.Capacitor.Plugins.StatusBar.setOverlaysWebView({ overlay: true }).catch(()=>{});
                          window.Capacitor.Plugins.StatusBar.hide().catch(()=>{});
                          console.log("[VC] StatusBar.hide called");
                      }
                  } catch (e) { console.warn("[VC] StatusBar hide failed:", e); }
              }
              tryHideStatusBar();
              setTimeout(tryHideStatusBar, 500);
              setTimeout(tryHideStatusBar, 2000);
              setTimeout(tryHideStatusBar, 5000);

              function setKey(key, on) {
                  if (key === "menu") {
                      if (on && SceneManager._scene instanceof Scene_Map && !$gameMessage.isBusy()) {
                          SceneManager._scene.callMenu();
                      }
                      return;
                  }
                  Input._currentState[key] = on;
                  if (on) { Input._latestButton = key; Input._pressedTime = 0; }
              }
              function makeEl(id, label, style) {
                  const el = document.createElement("div");
                  el.textContent = label;
                  el.style.cssText = "position:fixed;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;font-family:Arial,sans-serif;font-weight:bold;color:#fff;z-index:2147483646;border-radius:50%;" + style;
                  const start = (e) => { e.preventDefault(); e.stopPropagation(); setKey(id, true); };
                  const end = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } setKey(id, false); };
                  el.addEventListener("touchstart", start, { passive: false });
                  el.addEventListener("touchend", end, { passive: false });
                  el.addEventListener("touchcancel", end);
                  el.addEventListener("mousedown", start);
                  el.addEventListener("mouseup", end);
                  el.addEventListener("mouseleave", end);
                  return el;
              }
              function build() {
                  if (root) return;
                  root = document.createElement("div");
                  root.id = "vc-root";
                  root.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;z-index:2147483646;";
                  document.body.appendChild(root);
                  const vw = innerWidth, vh = innerHeight;
                  const ds = CFG.dpadSize, dm = CFG.dpadMargin;
                  const as = ds / 3, dx = dm, dy = vh - ds - dm;
                  const arrowStyle = "background:rgba(255,255,255," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);border-radius:10px;font-size:24px;";
                  const add = (id, label, left, top, size, style) => {
                      const el = makeEl(id, label, style + "left:" + left + "px;top:" + top + "px;width:" + size + "px;height:" + size + "px;");
                      root.appendChild(el);
                  };
                  add("up", "▲", dx + as, dy, as, arrowStyle);
                  add("down", "▼", dx + as, dy + as * 2, as, arrowStyle);
                  add("left", "◀", dx, dy + as, as, arrowStyle);
                  add("right", "▶", dx + as * 2, dy + as, as, arrowStyle);
                  const bs = CFG.btnSize, bm = CFG.btnMargin, bg = CFG.btnGap;
                  const okStyle = "background:rgba(80,200,80," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  const cancelStyle = "background:rgba(200,80,80," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  const menuStyle = "background:rgba(80,80,200," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:26px;";
                  const dashStyle = "background:rgba(220,180,40," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  add("ok", "OK", vw - bm - bs, vh - bm - bs, bs, okStyle);
                  add("cancel", "X", vw - bm - bs * 2 - bg, vh - bm - bs, bs, cancelStyle);
                  add("shift", "⇧", vw - bm - bs * 3 - bg * 2, vh - bm - bs, bs, dashStyle);
                  add("menu", "≡", vw - bm - bs, vh - bm - bs * 2 - bg, bs, menuStyle);
              }
              window.addEventListener("load", () => setTimeout(build, 200));
              let rt = null;
              window.addEventListener("resize", () => {
                  clearTimeout(rt);
                  rt = setTimeout(() => { if (root) { root.remove(); root = null; } build(); }, 300);
              });
          })();
          EOF

      - name: Patch plugins.js (dedupe ForceCanvas/VirtualControls, enable, add to end)
        run: |
          python3 - <<'PYEOF'
          import re, glob, json
          p = glob.glob('www/**/plugins.js', recursive=True)[0]
          c = open(p, encoding='utf-8').read()

          # Extract the plugins array as text between first [ after $plugins = and last ]
          m = re.search(r'(\$plugins\s*=\s*)(\[.*\])(\s*;?)', c, re.DOTALL)
          if not m:
              print("ERROR: $plugins array not found")
              raise SystemExit(1)
          prefix = m.group(1)
          arr_text = m.group(2)
          suffix = m.group(3) or ';'

          # Try to parse as JSON
          try:
              plugins = json.loads(arr_text)
              print("Parsed as JSON, {} entries".format(len(plugins)))
          except Exception as e:
              print("JSON parse failed: {}".format(e))
              print("Falling back to regex removal")
              # Remove all ForceCanvas and VirtualControls entries via balanced braces
              def remove_plugin(text, name):
                  result = text
                  search = '"name": "{}"'.format(name)
                  search2 = '"name":"{}"'.format(name)
                  while True:
                      idx = result.find(search)
                      if idx == -1: idx = result.find(search2)
                      if idx == -1: break
                      # Find start {
                      start = result.rfind('{', 0, idx)
                      if start == -1: break
                      # Find matching } with depth
                      depth = 0
                      end = -1
                      for i in range(start, len(result)):
                          if result[i] == '{': depth += 1
                          elif result[i] == '}':
                              depth -= 1
                              if depth == 0:
                                  end = i
                                  break
                      if end == -1: break
                      # Remove trailing comma
                      after = end + 1
                      while after < len(result) and result[after] in ' \t\n\r': after += 1
                      if after < len(result) and result[after] == ',':
                          end = after
                      result = result[:start] + result[end+1:]
                  return result
              arr_text = remove_plugin(arr_text, 'ForceCanvas')
              arr_text = remove_plugin(arr_text, 'VirtualControls')
              # Add back at end
              arr_text = arr_text.rstrip()
              if arr_text.endswith(']'):
                  arr_text = arr_text[:-1].rstrip()
                  if not arr_text.endswith(','): arr_text += ','
                  arr_text += '{"name":"VirtualControls","status":true,"description":"","parameters":{}},'
                  arr_text += '{"name":"ForceCanvas","status":true,"description":"","parameters":{}}]'
              # Disable Greenworks, Pixelate
              arr_text = re.sub(r'("name"\s*:\s*"OrangeGreenworks"\s*,\s*"status"\s*:\s*)true', r'\1false', arr_text)
              arr_text = arr_text.replace('"PixelateImageRendering:eval":"true"', '"PixelateImageRendering:eval":"false"')
              c = prefix + arr_text + suffix
              open(p, 'w', encoding='utf-8').write(c)
              print("Regex path: ForceCanvas and VirtualControls removed and re-added")
              print("verify ForceCanvas present: ", '"ForceCanvas"' in c)
              print("verify VirtualControls present: ", '"VirtualControls"' in c)
              raise SystemExit(0)

          # JSON path succeeded — filter and rebuild
          new_plugins = []
          for pl in plugins:
              name = pl.get('name', '')
              if name in ('ForceCanvas', 'VirtualControls'):
                  continue
              if name == 'OrangeGreenworks':
                  pl['status'] = False
              new_plugins.append(pl)

          new_plugins.append({"name": "VirtualControls", "status": True, "description": "", "parameters": {}})
          new_plugins.append({"name": "ForceCanvas", "status": True, "description": "", "parameters": {}})

          # Also disable Pixelate in CoreEngine
          for pl in new_plugins:
              if pl.get('name') == 'VisuMZ_0_CoreEngine':
                  params = pl.get('parameters', {})
                  if 'QoL:struct' in params:
                      params['QoL:struct'] = params['QoL:struct'].replace('"PixelateImageRendering:eval":"true"', '"PixelateImageRendering:eval":"false"')

          arr_out = json.dumps(new_plugins, ensure_ascii=False)
          c = prefix + arr_out + suffix
          open(p, 'w', encoding='utf-8').write(c)
          print("ForceCanvas (last): True")
          print("VirtualControls (second-last): True")
          print("Greenworks disabled: True")
          print("Total plugins:", len(new_plugins))
          PYEOF

      - name: Install Capacitor + StatusBar
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar

      - name: Init and add Android
        run: |
          npx cap init "Bad Bitch Blasters" "com.badbit.chblasters" --web-dir www
          npx cap add android

      - name: Patch Android (landscape + WindowInsetsController + edge-to-edge)
        run: |
          python3 - <<'PYEOF'
          import re, glob

          p = 'android/app/src/main/AndroidManifest.xml'
          m = open(p, encoding='utf-8').read()
          if 'usesCleartextTraffic' not in m:
              m = m.replace('<application', '<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"', 1)
          if 'screenOrientation' not in m:
              m = m.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"', 1)
          open(p, 'w', encoding='utf-8').write(m)
          print('manifest done')

          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          def fix(mt):
              b = mt.group(0)
              if 'windowFullscreen' in b:
                  return b
              return b.replace('</style>', '    <item name="android:windowFullscreen">true</item>\n</style>')
          s = re.sub(r'<style\b[^>]*>.*?</style>', fix, s, flags=re.DOTALL)
          open(p, 'w', encoding='utf-8').write(s)
          print('styles fullscreen:', s.count('windowFullscreen'))

          paths = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          if paths:
              p = paths[0]
              old = open(p, encoding='utf-8').read()
              pm = re.search(r'package\s+([\w.]+);', old)
              pkg = pm.group(1) if pm else 'com.badbit.chblasters'
              java = (
                'package ' + pkg + ';\n\n'
                'import android.os.Build;\n'
                'import android.os.Bundle;\n'
                'import android.os.Handler;\n'
                'import android.os.Looper;\n'
                'import android.view.View;\n'
                'import android.view.WindowInsets;\n'
                'import android.view.WindowInsetsController;\n'
                'import android.view.WindowManager;\n'
                'import com.getcapacitor.BridgeActivity;\n\n'
                'public class MainActivity extends BridgeActivity {\n'
                '    private final Handler handler = new Handler(Looper.getMainLooper());\n'
                '    private final Runnable hideRunnable = new Runnable() {\n'
                '        @Override public void run() { goFullscreen(); }\n'
                '    };\n\n'
                '    @Override\n'
                '    public void onCreate(Bundle s) {\n'
                '        super.onCreate(s);\n'
                '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n'
                '            getWindow().setDecorFitsSystemWindows(false);\n'
                '        }\n'
                '        getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);\n'
                '        goFullscreen();\n'
                '        handler.postDelayed(hideRunnable, 50);\n'
                '        handler.postDelayed(hideRunnable, 300);\n'
                '        handler.postDelayed(hideRunnable, 800);\n'
                '        handler.postDelayed(hideRunnable, 1500);\n'
                '        handler.postDelayed(hideRunnable, 3000);\n'
                '    }\n\n'
                '    @Override\n'
                '    public void onWindowFocusChanged(boolean has) {\n'
                '        super.onWindowFocusChanged(has);\n'
                '        if (has) goFullscreen();\n'
                '    }\n\n'
                '    @Override\n'
                '    public void onDestroy() {\n'
                '        super.onDestroy();\n'
                '        handler.removeCallbacks(hideRunnable);\n'
                '    }\n\n'
                '    private void goFullscreen() {\n'
                '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n'
                '            WindowInsetsController c = getWindow().getInsetsController();\n'
                '            if (c != null) {\n'
                '                c.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());\n'
                '                c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);\n'
                '            }\n'
                '        }\n'
                '        getWindow().getDecorView().setSystemUiVisibility(\n'
                '            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY\n'
                '            | View.SYSTEM_UI_FLAG_LAYOUT_STABLE\n'
                '            | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION\n'
                '            | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN\n'
                '            | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION\n'
                '            | View.SYSTEM_UI_FLAG_FULLSCREEN);\n'
                '    }\n'
                '}\n'
              )
              open(p, 'w', encoding='utf-8').write(java)
              print('MainActivity rewritten (WindowInsetsController + onDestroy public)')
          PYEOF

      - name: Build
        run: |
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bbb-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
