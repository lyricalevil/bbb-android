name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download game + diagnostics
        run: |
          mkdir -p www
          wget -O game.zip "https://github.com/${{ github.repository }}/releases/download/v1/Bad.Bitch.Blasters.Build.23837192.zip"
          unzip -q game.zip -d www
          echo "=== MZ version ==="
          grep -m1 "Utils.RPGMAKER_VERSION" www/js/rmmz_core.js 2>&1 || true
          grep -m1 "RPGMAKER_NAME" www/js/rmmz_core.js 2>&1 || true
          echo "=== Graphics.initialize full block ==="
          sed -n '483,520p' www/js/rmmz_core.js 2>&1 | head -40
          echo "=== Search Bitmap._createBaseTexture ==="
          grep -n "_createBaseTexture\|_createTexture" www/js/rmmz_core.js 2>&1 | head -10 || echo "NONE"
          echo "=== Search PIXI in rmmz_core ==="
          grep -n "PIXI\." www/js/rmmz_core.js 2>&1 | head -15 || echo "NONE"
          echo "=== pixi.js version ==="
          grep -m3 "VERSION\|version" www/js/libs/pixi.js 2>&1 | head -5 || true

      - name: Write ForceCanvas v6 (safe settings + Bitmap patch, no init override)
        run: |
          PLUGINS_DIR=$(dirname "$(find www -name plugins.js 2>/dev/null | head -1)")
          cat > "$PLUGINS_DIR/plugins/ForceCanvas.js" <<'EOF'
          (() => {
              "use strict";
              function log(m) { console.log("[ForceCanvas] " + m); }
              function err(m) { console.error("[ForceCanvas] " + m); }

              log("v6 loaded - safe settings + Bitmap patch only");

              // 1) PIXI settings — apply if available
              try {
                  if (PIXI && PIXI.settings && PIXI.SCALE_MODES) {
                      PIXI.settings.SCALE_MODE = PIXI.SCALE_MODES.NEAREST;
                      log("settings.SCALE_MODE = NEAREST");
                  }
              } catch (e) { err("settings.SCALE_MODE: " + e); }

              try {
                  if (PIXI && PIXI.settings && PIXI.MIPMAP_MODES) {
                      PIXI.settings.MIPMAP_TEXTURES = PIXI.MIPMAP_MODES.OFF;
                      log("settings.MIPMAP_TEXTURES = OFF");
                  }
              } catch (e) { err("settings.MIPMAP: " + e); }

              try {
                  if (PIXI && PIXI.settings) {
                      PIXI.settings.ROUND_PIXELS = true;
                      log("settings.ROUND_PIXELS = true");
                  }
              } catch (e) { err("settings.ROUND_PIXELS: " + e); }

              // 2) BaseTexture default options
              try {
                  if (PIXI && PIXI.BaseTexture && PIXI.BaseTexture.defaultOptions) {
                      PIXI.BaseTexture.defaultOptions.scaleMode = PIXI.SCALE_MODES.NEAREST;
                      PIXI.BaseTexture.defaultOptions.mipmap = PIXI.MIPMAP_MODES.OFF;
                      log("BaseTexture.defaultOptions patched");
                  }
              } catch (e) { err("BaseTexture.defaultOptions: " + e); }

              // 3) Patch Bitmap._createBaseTexture (новые текстуры)
              try {
                  if (typeof Bitmap !== "undefined" && Bitmap.prototype._createBaseTexture) {
                      const origBase = Bitmap.prototype._createBaseTexture;
                      Bitmap.prototype._createBaseTexture = function (bitmap) {
                          const bt = origBase.call(this, bitmap);
                          try {
                              bt.scaleMode = PIXI.SCALE_MODES.NEAREST;
                              bt.mipmap = PIXI.MIPMAP_MODES.OFF;
                              bt.update();
                          } catch (e) {}
                          return bt;
                      };
                      log("Bitmap._createBaseTexture patched");
                  } else {
                      log("Bitmap._createBaseTexture not found, trying alternative");
                  }
              } catch (e) { err("Bitmap patch: " + e); }

              // 4) Retrofit already-loaded textures periodically (безопасно)
              let retrofitCount = 0;
              function retrofit() {
                  try {
                      if (!PIXI || !PIXI.utils || !PIXI.utils.TextureCache) return;
                      let n = 0;
                      const cache = PIXI.utils.TextureCache;
                      for (const k in cache) {
                          const tex = cache[k];
                          if (tex && tex.baseTexture && tex.baseTexture.scaleMode !== PIXI.SCALE_MODES.NEAREST) {
                              tex.baseTexture.scaleMode = PIXI.SCALE_MODES.NEAREST;
                              tex.baseTexture.update();
                              n++;
                          }
                      }
                      if (n > 0) {
                          retrofitCount += n;
                          log("retrofitted " + n + " textures (total " + retrofitCount + ")");
                      }
                  } catch (e) {}
              }
              setTimeout(retrofit, 500);
              setTimeout(retrofit, 1500);
              setTimeout(retrofit, 3000);
              setTimeout(retrofit, 6000);

              // 5) Indicator
              window.addEventListener("load", () => {
                  setTimeout(() => {
                      try {
                          const r = Graphics._renderer;
                          let s = "none", c = "#a00";
                          if (r) {
                              if (r.type === 1) { s = "Canvas"; c = "#0a0"; }
                              else if (r.type === 2) { s = "WebGL+NEAREST"; c = "#0a0"; }
                              else { s = "type=" + r.type; c = "#a80"; }
                          }
                          const d = document.createElement("div");
                          d.textContent = "R: " + s;
                          d.style.cssText = "position:fixed;top:8px;right:8px;padding:10px 18px;background:" + c + ";color:#fff;font-family:monospace;font-size:22px;font-weight:bold;z-index:2147483647;border-radius:6px;";
                          document.body.appendChild(d);
                          setTimeout(() => d.remove(), 15000);
                      } catch (e) {}
                  }, 2500);
              });
          })();
          EOF

      - name: Write VirtualControls plugin
        run: |
          PLUGINS_DIR=$(dirname "$(find www -name plugins.js 2>/dev/null | head -1)")
          cat > "$PLUGINS_DIR/plugins/VirtualControls.js" <<'EOF'
          (() => {
              "use strict";
              const CFG = { dpadSize: 150, dpadMargin: 30, btnSize: 68, btnMargin: 40, btnGap: 14, opacity: 0.45 };
              let root = null;
              function tryHideStatusBar() {
                  try {
                      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
                          window.Capacitor.Plugins.StatusBar.setOverlaysWebView({ overlay: true }).catch(()=>{});
                          window.Capacitor.Plugins.StatusBar.hide().catch(()=>{});
                      }
                  } catch (e) {}
              }
              tryHideStatusBar();
              setTimeout(tryHideStatusBar, 500);
              setTimeout(tryHideStatusBar, 2000);
              setTimeout(tryHideStatusBar, 5000);

              function setKey(key, on) {
                  if (key === "menu") {
                      if (on && SceneManager._scene instanceof Scene_Map && !$gameMessage.isBusy()) {
                          SceneManager._scene.callMenu();
                      }
                      return;
                  }
                  Input._currentState[key] = on;
                  if (on) { Input._latestButton = key; Input._pressedTime = 0; }
              }
              function makeEl(id, label, style) {
                  const el = document.createElement("div");
                  el.textContent = label;
                  el.style.cssText = "position:fixed;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;font-family:Arial,sans-serif;font-weight:bold;color:#fff;z-index:2147483646;border-radius:50%;" + style;
                  const start = (e) => { e.preventDefault(); e.stopPropagation(); setKey(id, true); };
                  const end = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } setKey(id, false); };
                  el.addEventListener("touchstart", start, { passive: false });
                  el.addEventListener("touchend", end, { passive: false });
                  el.addEventListener("touchcancel", end);
                  el.addEventListener("mousedown", start);
                  el.addEventListener("mouseup", end);
                  el.addEventListener("mouseleave", end);
                  return el;
              }
              function build() {
                  if (root) return;
                  root = document.createElement("div");
                  root.id = "vc-root";
                  root.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;z-index:2147483646;";
                  document.body.appendChild(root);
                  const vw = innerWidth, vh = innerHeight;
                  const ds = CFG.dpadSize, dm = CFG.dpadMargin;
                  const as = ds / 3, dx = dm, dy = vh - ds - dm;
                  const arrowStyle = "background:rgba(255,255,255," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);border-radius:10px;font-size:24px;";
                  const add = (id, label, left, top, size, style) => {
                      const el = makeEl(id, label, style + "left:" + left + "px;top:" + top + "px;width:" + size + "px;height:" + size + "px;");
                      root.appendChild(el);
                  };
                  add("up", "▲", dx + as, dy, as, arrowStyle);
                  add("down", "▼", dx + as, dy + as * 2, as, arrowStyle);
                  add("left", "◀", dx, dy + as, as, arrowStyle);
                  add("right", "▶", dx + as * 2, dy + as, as, arrowStyle);
                  const bs = CFG.btnSize, bm = CFG.btnMargin, bg = CFG.btnGap;
                  const okStyle = "background:rgba(80,200,80," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  const cancelStyle = "background:rgba(200,80,80," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  const menuStyle = "background:rgba(80,80,200," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:26px;";
                  const dashStyle = "background:rgba(220,180,40," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  add("ok", "OK", vw - bm - bs, vh - bm - bs, bs, okStyle);
                  add("cancel", "X", vw - bm - bs * 2 - bg, vh - bm - bs, bs, cancelStyle);
                  add("shift", "⇧", vw - bm - bs * 3 - bg * 2, vh - bm - bs, bs, dashStyle);
                  add("menu", "≡", vw - bm - bs, vh - bm - bs * 2 - bg, bs, menuStyle);
              }
              window.addEventListener("load", () => setTimeout(build, 200));
              let rt = null;
              window.addEventListener("resize", () => {
                  clearTimeout(rt);
                  rt = setTimeout(() => { if (root) { root.remove(); root = null; } build(); }, 300);
              });
          })();
          EOF

      - name: Patch plugins.js (JSON-safe)
        run: |
          python3 - <<'PYEOF'
          import re, glob, json
          p = glob.glob('www/**/plugins.js', recursive=True)[0]
          c = open(p, encoding='utf-8').read()

          m = re.search(r'(\$plugins\s*=\s*)(\[[\s\S]*\])(\s*;?\s*)$', c)
          if not m:
              print("ERROR: $plugins array not found")
              raise SystemExit(1)
          prefix, arr_text, suffix = m.group(1), m.group(2), m.group(3) or ';'

          try:
              plugins = json.loads(arr_text)
          except Exception as e:
              print("ERROR: JSON parse failed:", e)
              raise SystemExit(1)

          before = len(plugins)
          plugins = [pl for pl in plugins if pl.get('name') not in ('ForceCanvas', 'VirtualControls')]
          print("Removed existing:", before - len(plugins))

          for pl in plugins:
              name = pl.get('name', '')
              if name == 'OrangeGreenworks':
                  pl['status'] = False
              if name == 'VisuMZ_0_CoreEngine':
                  params = pl.get('parameters', {})
                  qol = params.get('QoL:struct', '')
                  if isinstance(qol, str):
                      qol_new = qol.replace('"PixelateImageRendering:eval":"true"', '"PixelateImageRendering:eval":"false"')
                      if qol != qol_new:
                          params['QoL:struct'] = qol_new

          plugins.append({"name": "VirtualControls", "status": True, "description": "", "parameters": {}})
          plugins.append({"name": "ForceCanvas", "status": True, "description": "", "parameters": {}})

          new_arr = json.dumps(plugins, ensure_ascii=False)
          c_new = prefix + new_arr + ';'
          open(p, 'w', encoding='utf-8').write(c_new)

          m2 = re.search(r'(\$plugins\s*=\s*)(\[[\s\S]*\])(\s*;?\s*)$', c_new)
          verify = json.loads(m2.group(2))
          print("Verify:", len(verify), "plugins, last two:", [pl['name'] for pl in verify[-2:]])
          PYEOF

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar

      - name: Init and add Android
        run: |
          npx cap init "Bad Bitch Blasters" "com.badbit.chblasters" --web-dir www
          npx cap add android

      - name: Patch Android
        run: |
          python3 - <<'PYEOF'
          import re, glob

          p = 'android/app/src/main/AndroidManifest.xml'
          m = open(p, encoding='utf-8').read()
          if 'usesCleartextTraffic' not in m:
              m = m.replace('<application', '<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"', 1)
          if 'screenOrientation' not in m:
              m = m.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"', 1)
          open(p, 'w', encoding='utf-8').write(m)
          print('manifest done')

          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          def fix(mt):
              b = mt.group(0)
              if 'windowFullscreen' in b:
                  return b
              return b.replace('</style>', '    <item name="android:windowFullscreen">true</item>\n</style>')
          s = re.sub(r'<style\b[^>]*>.*?</style>', fix, s, flags=re.DOTALL)
          open(p, 'w', encoding='utf-8').write(s)
          print('styles fullscreen:', s.count('windowFullscreen'))

          paths = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          if paths:
              p = paths[0]
              old = open(p, encoding='utf-8').read()
              pm = re.search(r'package\s+([\w.]+);', old)
              pkg = pm.group(1) if pm else 'com.badbit.chblasters'
              java = (
                'package ' + pkg + ';\n\n'
                'import android.graphics.Color;\n'
                'import android.os.Build;\n'
                'import android.os.Bundle;\n'
                'import android.os.Handler;\n'
                'import android.os.Looper;\n'
                'import android.view.WindowManager;\n'
                'import androidx.core.view.WindowCompat;\n'
                'import androidx.core.view.WindowInsetsCompat;\n'
                'import androidx.core.view.WindowInsetsControllerCompat;\n'
                'import com.getcapacitor.BridgeActivity;\n\n'
                'public class MainActivity extends BridgeActivity {\n'
                '    private final Handler handler = new Handler(Looper.getMainLooper());\n'
                '    private final Runnable hideRunnable = new Runnable() {\n'
                '        @Override public void run() { goFullscreen(); }\n'
                '    };\n\n'
                '    @Override\n'
                '    public void onCreate(Bundle s) {\n'
                '        super.onCreate(s);\n'
                '        WindowCompat.setDecorFitsSystemWindows(getWindow(), false);\n'
                '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {\n'
                '            getWindow().getAttributes().layoutInDisplayCutoutMode =\n'
                '                WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;\n'
                '        }\n'
                '        getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);\n'
                '        getWindow().setStatusBarColor(Color.TRANSPARENT);\n'
                '        getWindow().setNavigationBarColor(Color.TRANSPARENT);\n'
                '        goFullscreen();\n'
                '        handler.postDelayed(hideRunnable, 50);\n'
                '        handler.postDelayed(hideRunnable, 300);\n'
                '        handler.postDelayed(hideRunnable, 800);\n'
                '        handler.postDelayed(hideRunnable, 1500);\n'
                '        handler.postDelayed(hideRunnable, 3000);\n'
                '    }\n\n'
                '    @Override\n'
                '    public void onWindowFocusChanged(boolean has) {\n'
                '        super.onWindowFocusChanged(has);\n'
                '        if (has) goFullscreen();\n'
                '    }\n\n'
                '    @Override\n'
                '    public void onDestroy() {\n'
                '        super.onDestroy();\n'
                '        handler.removeCallbacks(hideRunnable);\n'
                '    }\n\n'
                '    private void goFullscreen() {\n'
                '        WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());\n'
                '        c.hide(WindowInsetsCompat.Type.systemBars());\n'
                '        c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);\n'
                '    }\n'
                '}\n'
              )
              open(p, 'w', encoding='utf-8').write(java)
              print('MainActivity rewritten (WindowCompat)')
          PYEOF

      - name: Build
        run: |
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bbb-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
