                  panelOpen = !panelOpen;
                  if (panelOpen) { if (panel) { panel.remove(); panel = null; } panel = buildPanel(); }
                  panel.style.display = panelOpen ? "block" : "none";
              }
              function build() {
                  if (root) return;
                  root = document.createElement("div");
                  root.id = "vc-root";
                  root.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;z-index:2147483646;";
                  document.body.appendChild(root);
                  buttons.up = makeButton("up", "▲", 50, false);
                  buttons.down = makeButton("down", "▼", 50, false);
                  buttons.left = makeButton("left", "◀", 50, false);
                  buttons.right = makeButton("right", "▶", 50, false);
                  buttons.ok = makeButton("ok", "ok.", 68, true);
                  buttons.no = makeButton("no", "no.", 68, true);
                  buttons.mnu = makeButton("mnu", "mnu", 68, true);
                  for (const id in buttons) root.appendChild(buttons[id]);
                  settingsBtn = document.createElement("div");
                  settingsBtn.textContent = "⚙";
                  settingsBtn.style.cssText = "position:fixed;top:8px;right:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;z-index:2147483646;font-family:Arial;font-weight:bold;user-select:none;-webkit-user-select:none;touch-action:manipulation;";
                  attachTapFast(settingsBtn, togglePanel);
                  root.appendChild(settingsBtn);
                  refreshAll(); applyAllPositions(); updateVisibility();
                  setInterval(updateVisibility, 500);
              }
              window.addEventListener("load", () => setTimeout(build, 200));
              let rt = null;
              window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { applyAllPositions(); refreshAll(); }, 300); });
          })();
          EOF

      - name: Write MusicPlayer v5 (own pos tracking)
        run: |
          PLUGINS_DIR=$(dirname "$(find www -name plugins.js 2>/dev/null | head -1)")
          cat > "$PLUGINS_DIR/plugins/MusicPlayer.js" <<'EOF'
          (() => {
              "use strict";
              function log(m) { console.log("[MP] " + m); }
              const builtinTracks = window.__musicTracks || [];
              log("builtin " + builtinTracks.length);

              let root = null, panel = null;
              let expanded = false, showList = false;
              let currentType = null, currentIndex = -1, currentCustomId = null, currentName = "—";
              let override = false, isPlaying = false, userVolume = 1.0;
              let savedGameBgm = null;
              let currentAudio = null;
              let customTracks = [];
              let progressTimer = null;
              let seeking = false;

              // Позиция для builtin — считаем сами
              let myPos = 0;           // сохранённая позиция (сек)
              let myPosTimestamp = null; // Date.now()/1000 когда стартовал
              let myDuration = 0;

              let origPlayBgm, origStopBgm, origFadeoutBgm, origPauseBgm, origResumeBgm;
              try {
                  origPlayBgm = AudioManager.playBgm.bind(AudioManager);
                  origStopBgm = AudioManager.stopBgm.bind(AudioManager);
                  origFadeoutBgm = AudioManager.fadeOutBgm.bind(AudioManager);
                  if (AudioManager.pauseBgm) origPauseBgm = AudioManager.pauseBgm.bind(AudioManager);
                  if (AudioManager.resumeBgm) origResumeBgm = AudioManager.resumeBgm.bind(AudioManager);
                  log("pauseBgm=" + (!!origPauseBgm) + " resumeBgm=" + (!!origResumeBgm));

                  AudioManager.playBgm = function (bgm, pos) {
                      if (override && (currentType === "builtin" || currentType === "custom")) { savedGameBgm = bgm; return; }
                      origPlayBgm(bgm, pos);
                      setTimeout(refreshFromGame, 100);
                  };
                  AudioManager.stopBgm = function () {
                      if (override && (currentType === "builtin" || currentType === "custom")) return;
                      origStopBgm();
                      setTimeout(refreshFromGame, 100);
                  };
                  AudioManager.fadeOutBgm = function (d) {
                      if (override && (currentType === "builtin" || currentType === "custom")) return;
                      origFadeoutBgm(d);
                  };
              } catch (e) { console.error("[MP] AudioManager:", e); }

              // ---- IndexedDB ----
              function openDB() {
                  return new Promise((res, rej) => {
                      const r = indexedDB.open("mp_custom_tracks", 1);
                      r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains("tracks")) db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true }); };
                      r.onsuccess = () => res(r.result);
                      r.onerror = () => rej(r.error);
                  });
              }
              async function dbAdd(file) {
                  const db = await openDB();
                  return new Promise((res, rej) => {
                      const tx = db.transaction("tracks", "readwrite");
                      const r = tx.objectStore("tracks").add({ name: file.name.replace(/\.[^.]+$/, ""), blob: file, addedAt: Date.now() });
                      r.onsuccess = () => res(r.result);
                      r.onerror = () => rej(r.error);
                  });
              }
              async function dbLoad() {
                  const db = await openDB();
                  return new Promise((res, rej) => {
                      const tx = db.transaction("tracks", "readonly");
                      const r = tx.objectStore("tracks").getAll();
                      r.onsuccess = () => res(r.result || []);
                      r.onerror = () => rej(r.error);
                  });
              }
              async function dbDelete(id) {
                  const db = await openDB();
                  return new Promise((res, rej) => {
                      const tx = db.transaction("tracks", "readwrite");
                      const r = tx.objectStore("tracks").delete(id);
                      r.onsuccess = () => res();
                      r.onerror = () => rej(r.error);
                  });
              }
              async function loadCustom() {
                  try { customTracks = await dbLoad(); log("custom " + customTracks.length); }
                  catch (e) { console.error("[MP] loadCustom:", e); }
              }

              function getCfg() { return window.__vc_cfg || {}; }
              function getPlayerCfg() { return (getCfg().player) || { x: null, y: null, panelX: null, panelY: null, scale: 1.0, opacity: 0.92, color: "#14141e", accent: "#5078c8" }; }

              function applyVolume() {
                  try { AudioManager._bgmVolume = userVolume; if (AudioManager._bgmBuffer) AudioManager._bgmBuffer.volume = userVolume; } catch (e) {}
                  if (currentAudio) currentAudio.volume = userVolume;
              }

              // ==== POSITION TRACKING ====
              function nowSec() { return Date.now() / 1000; }

              function updateMyDuration() {
                  try {
                      if (currentType === "custom" && currentAudio) {
                          const d = currentAudio.duration;
                          if (isFinite(d) && d > 0) myDuration = d;
                      } else if (currentType === "builtin") {
                          const buf = AudioManager._bgmBuffer;
                          if (buf && buf._buffer) {
                              const d = buf._buffer.duration;
                              if (isFinite(d) && d > 0) myDuration = d;
                          }
                      }
                  } catch (e) {}
              }

              function getCurrentPos() {
                  try {
                      if (currentType === "custom" && currentAudio) {
                          const t = currentAudio.currentTime;
                          return isFinite(t) ? t : 0;
                      }
                      if (currentType === "builtin") {
                          if (myPosTimestamp !== null) {
                              return myPos + (nowSec() - myPosTimestamp);
                          }
                          return myPos;
                      }
                  } catch (e) {}
                  return 0;
              }

              function getDuration() {
                  updateMyDuration();
                  return myDuration;
              }

              function startPositionTracking(startAt) {
                  myPos = startAt || 0;
                  myPosTimestamp = nowSec();
              }
              function pausePositionTracking() {
                  if (myPosTimestamp !== null) {
                      myPos += nowSec() - myPosTimestamp;
                      myPosTimestamp = null;
                  }
              }
              function resumePositionTracking() {
                  if (myPosTimestamp === null) {
                      myPosTimestamp = nowSec();
                  }
              }
              function resetPositionTracking() {
                  myPos = 0;
                  myPosTimestamp = null;
                  myDuration = 0;
              }

              function seekTo(pct) {
                  try {
                      if (currentType === "custom" && currentAudio) {
                          const d = currentAudio.duration;
                          if (isFinite(d) && d > 0) {
                              const target = Math.max(0, Math.min(d - 0.05, pct * d));
                              currentAudio.currentTime = target;
                              myPos = target;
                          }
                          return;
                      }
                      if (currentType === "builtin") {
                          const dur = getDuration();
                          if (!dur) return;
                          const target = Math.max(0, Math.min(dur - 0.05, pct * dur));
                          const bgm = AudioManager._currentBgm;
                          if (origPlayBgm && bgm) {
                              origPlayBgm(bgm, target);
                              startPositionTracking(target);
                              isPlaying = true;
                          }
                      }
                  } catch (e) { console.error("[MP] seek:", e); }
              }

              // ==== PLAYBACK ====
              function stopAll() {
                  try { if (origStopBgm) origStopBgm(); } catch (e) {}
                  if (currentAudio) {
                      try { currentAudio.pause(); if (currentAudio.src) URL.revokeObjectURL(currentAudio.src); } catch (e) {}
                      currentAudio.src = "";
                  }
                  resetPositionTracking();
              }

              function refreshFromGame() {
                  if (currentType && override) return;
                  const bgm = AudioManager._currentBgm;
                  if (bgm && bgm.name) {
                      const idx = builtinTracks.indexOf(bgm.name);
                      if (idx >= 0) {
                          if (currentType !== "builtin" || currentIndex !== idx) {
                              currentType = "builtin"; currentIndex = idx; currentName = bgm.name; currentCustomId = null;
                              startPositionTracking(0);
                          }
                      }
                      isPlaying = !!AudioManager._bgmBuffer;
                  } else {
                      isPlaying = false;
                  }
                  updateUI();
              }

              function playBuiltin(index) {
                  if (!builtinTracks.length) return;
                  if (index < 0) index = builtinTracks.length - 1;
                  if (index >= builtinTracks.length) index = 0;
                  stopAll();
                  currentType = "builtin"; currentIndex = index; currentName = builtinTracks[index]; currentCustomId = null;
                  if (!override && AudioManager._currentBgm) savedGameBgm = AudioManager._currentBgm;
                  try {
                      AudioManager._bgmVolume = userVolume;
                      const bgm = { name: builtinTracks[index], volume: 100, pitch: 100, pan: 0 };
                      if (origPlayBgm) origPlayBgm(bgm);
                      startPositionTracking(0);
                      isPlaying = true;
                      applyVolume();
                      setTimeout(updateMyDuration, 200);
                      setTimeout(updateMyDuration, 800);
                  } catch (e) { console.error("[MP] playBuiltin:", e); }
                  updateUI();
              }

              function playCustom(track) {
                  stopAll();
                  if (!currentAudio) {
                      currentAudio = new Audio();
                      currentAudio.addEventListener("ended", () => { isPlaying = false; updateUI(); });
                      currentAudio.addEventListener("loadedmetadata", () => {
                          const d = currentAudio.duration;
                          if (isFinite(d) && d > 0) myDuration = d;
                          updateUI();
                      });
                      currentAudio.addEventListener("timeupdate", () => { /* handled by timer */ });
                  }
                  const url = URL.createObjectURL(track.blob);
                  currentAudio.src = url;
                  currentAudio.volume = userVolume;
                  myDuration = 0;
                  myPos = 0;
                  currentAudio.play().then(() => {
                      isPlaying = true;
                      if (isFinite(currentAudio.duration) && currentAudio.duration > 0) myDuration = currentAudio.duration;
                      updateUI();
                  }).catch(e => { console.error("[MP] custom play:", e); isPlaying = false; updateUI(); });
                  currentType = "custom"; currentCustomId = track.id; currentName = track.name; currentIndex = -1;
                  updateUI();
              }

              function togglePlay() {
                  if (isPlaying) {
                      // PAUSE
                      if (currentType === "custom" && currentAudio) {
                          currentAudio.pause();
                      } else if (currentType === "builtin") {
                          if (origPauseBgm) origPauseBgm();
                          pausePositionTracking();
                      }
                      isPlaying = false;
                  } else {
                      // RESUME
                      if (currentType === "custom" && currentAudio && currentAudio.src) {
                          currentAudio.play().catch(e => console.error(e));
                          isPlaying = true;
                      } else if (currentType === "builtin" && origResumeBgm) {
                          origResumeBgm();
                          resumePositionTracking();
                          isPlaying = true;
                      } else if (currentType === "builtin" && currentIndex >= 0) {
                          playBuiltin(currentIndex);
                          isPlaying = true;
                      } else if (currentIndex >= 0) {
                          playBuiltin(currentIndex);
                          isPlaying = true;
                      } else if (customTracks.length) {
                          playCustom(customTracks[0]);
                          isPlaying = true;
                      }
                  }
                  updateUI();
              }
              function nextTrack() {
                  if (currentType === "builtin") playBuiltin(currentIndex + 1);
                  else if (currentType === "custom") {
                      const idx = customTracks.findIndex(t => t.id === currentCustomId);
                      playCustom(customTracks[(idx + 1) % customTracks.length]);
                  } else if (builtinTracks.length) playBuiltin(0);
              }
              function prevTrack() {
                  if (currentType === "builtin") playBuiltin(currentIndex - 1);
                  else if (currentType === "custom") {
                      const idx = customTracks.findIndex(t => t.id === currentCustomId);
                      playCustom(customTracks[(idx - 1 + customTracks.length) % customTracks.length]);
                  } else if (builtinTracks.length) playBuiltin(0);
              }
              function setVolume(v) { userVolume = Math.max(0, Math.min(1, v)); applyVolume(); }
              function toggleOverride() {
                  override = !override;
                  if (!override) {
                      if (savedGameBgm && origPlayBgm) { origPlayBgm(savedGameBgm); savedGameBgm = null; startPositionTracking(0); }
                      currentType = null; currentIndex = -1; currentCustomId = null; currentName = "—";
                      resetPositionTracking();
                      setTimeout(refreshFromGame, 100);
                  }
                  updateUI();
              }

              function attachTap(el, cb) {
                  let sx = 0, sy = 0, st = 0, moved = false;
                  el.addEventListener("touchstart", (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); moved = false; }, { passive: true });
                  el.addEventListener("touchmove", (e) => { const t = e.touches[0]; if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) moved = true; }, { passive: true });
                  el.addEventListener("touchend", (e) => { if (moved || Date.now() - st > 500) return; e.preventDefault(); e.stopPropagation(); cb(); }, { passive: false });
                  el.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); cb(); });
              }
              function attachTapOrDrag(el, onTap, onDragEnd) {
                  let sx = 0, sy = 0, st = 0, moved = false, isDrag = false;
                  const onStart = (e) => { const t = (e.touches && e.touches[0]) || e; sx = t.clientX; sy = t.clientY; st = Date.now(); moved = false; isDrag = false; };
                  const onMove = (e) => {
                      const t = (e.touches && e.touches[0]) || e;
                      const dx = t.clientX - sx, dy = t.clientY - sy;
                      if (!moved && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) { moved = true; isDrag = true; }
                      if (isDrag) { el.style.left = (t.clientX - 20) + "px"; el.style.top = (t.clientY - 20) + "px"; if (e.cancelable) e.preventDefault(); }
                  };
                  const onEnd = (e) => {
                      if (isDrag) { if (onDragEnd) onDragEnd(el.getBoundingClientRect()); }
                      else if (!moved && Date.now() - st < 500) { if (e) { e.preventDefault(); e.stopPropagation(); } onTap(); }
                      isDrag = false;
                  };
                  el.addEventListener("touchstart", onStart, { passive: true });
                  el.addEventListener("touchmove", onMove, { passive: false });
                  el.addEventListener("touchend", onEnd, { passive: false });
                  el.addEventListener("mousedown", onStart);
                  el.addEventListener("mousemove", onMove);
                  el.addEventListener("mouseup", onEnd);
              }
              function attachDragToTitle(title, panel) {
                  let drag = false, sx = 0, sy = 0, sL = 0, sT = 0;
                  const start = (e) => {
                      const t = (e.touches && e.touches[0]) || e;
                      const r = panel.getBoundingClientRect();
                      sx = t.clientX; sy = t.clientY; sL = r.left; sT = r.top;
                      drag = true;
                      if (e.cancelable) e.preventDefault();
                  };
                  const move = (e) => {
                      if (!drag) return;
                      const t = (e.touches && e.touches[0]) || e;
                      let nl = sL + (t.clientX - sx), nt = sT + (t.clientY - sy);
                      const pw = panel.offsetWidth, ph = panel.offsetHeight;
                      nl = Math.max(0, Math.min(innerWidth - Math.min(60, pw), nl));
                      nt = Math.max(0, Math.min(innerHeight - Math.min(60, ph), nt));
                      panel.style.left = nl + "px"; panel.style.top = nt + "px";
                      if (e.cancelable) e.preventDefault();
                  };
                  const end = () => {
                      if (!drag) return;
                      drag = false;
                      const cfg = getCfg();
                      if (!cfg.player) cfg.player = {};
                      cfg.player.panelX = parseInt(panel.style.left) || 60;
