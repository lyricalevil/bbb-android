name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download and extract game
        run: |
          mkdir -p www
          wget -O game.zip "https://github.com/${{ github.repository }}/releases/download/v1/Bad.Bitch.Blasters.Build.23837192.zip"
          unzip -q game.zip -d www
          if [ ! -f www/index.html ]; then
            inner=$(find www -maxdepth 2 -name index.html | head -1 | xargs dirname 2>/dev/null || true)
            if [ -n "$inner" ] && [ "$inner" != "www" ]; then
              shopt -s dotglob
              mv "$inner"/* www/
              rmdir "$inner" || true
            fi
          fi

      - name: Write ForceCanvas (Canvas renderer)
        run: |
          cat > www/js/plugins/ForceCanvas.js << 'JSEOF'
          (() => {
              "use strict";
              if (typeof Graphics !== "undefined" && Graphics._createRenderer) {
                  Graphics._createRenderer = function () {
                      PIXI.dontSayHello = true;
                      try {
                          const r = new PIXI.CanvasRenderer(this._width, this._height, { view: this._canvas });
                          console.log("[ForceCanvas] Canvas OK");
                          return r;
                      } catch (e) {
                          console.error("[ForceCanvas] Canvas failed:", e);
                          return new PIXI.Renderer(this._width, this._height, { view: this._canvas });
                      }
                  };
              }
          })();
          JSEOF

      - name: Write VirtualControls plugin
        run: |
          cat > www/js/plugins/VirtualControls.js << 'JSEOF'
          (() => {
              "use strict";
              const CFG = { dpadSize: 150, dpadMargin: 20, btnSize: 68, btnMargin: 20, btnGap: 12, opacity: 0.45 };
              let root = null;
              function setKey(key, on) {
                  if (key === "menu") {
                      if (on && SceneManager._scene instanceof Scene_Map && !$gameMessage.isBusy()) {
                          SceneManager._scene.callMenu();
                      }
                      return;
                  }
                  Input._currentState[key] = on;
                  if (on) { Input._latestButton = key; Input._pressedTime = 0; }
              }
              function makeEl(id, label, style) {
                  const el = document.createElement("div");
                  el.textContent = label;
                  el.style.cssText = "position:fixed;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;font-family:Arial,sans-serif;font-weight:bold;color:#fff;z-index:99999;border-radius:50%;" + style;
                  const start = (e) => { e.preventDefault(); e.stopPropagation(); setKey(id, true); };
                  const end = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } setKey(id, false); };
                  el.addEventListener("touchstart", start, { passive: false });
                  el.addEventListener("touchend", end, { passive: false });
                  el.addEventListener("touchcancel", end);
                  el.addEventListener("mousedown", start);
                  el.addEventListener("mouseup", end);
                  el.addEventListener("mouseleave", end);
                  return el;
              }
              function build() {
                  if (root) return;
                  root = document.createElement("div");
                  root.id = "vc-root";
                  document.body.appendChild(root);
                  const vw = innerWidth, vh = innerHeight;
                  const ds = CFG.dpadSize, dm = CFG.dpadMargin;
                  const as = ds / 3, dx = dm, dy = vh - ds - dm;
                  const arrowStyle = "background:rgba(255,255,255," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);border-radius:10px;font-size:24px;";
                  const add = (id, label, left, top, size, style) => {
                      const el = makeEl(id, label, style + "left:" + left + "px;top:" + top + "px;width:" + size + "px;height:" + size + "px;");
                      root.appendChild(el);
                  };
                  add("up", "▲", dx + as, dy, as, arrowStyle);
                  add("down", "▼", dx + as, dy + as * 2, as, arrowStyle);
                  add("left", "◀", dx, dy + as, as, arrowStyle);
                  add("right", "▶", dx + as * 2, dy + as, as, arrowStyle);
                  const bs = CFG.btnSize, bm = CFG.btnMargin, bg = CFG.btnGap;
                  const okStyle = "background:rgba(80,200,80," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  const cancelStyle = "background:rgba(200,80,80," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  const menuStyle = "background:rgba(80,80,200," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:26px;";
                  const dashStyle = "background:rgba(220,180,40," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  add("ok", "OK", vw - bm - bs, vh - bm - bs, bs, okStyle);
                  add("cancel", "X", vw - bm - bs * 2 - bg, vh - bm - bs, bs, cancelStyle);
                  add("shift", "⇧", vw - bm - bs * 3 - bg * 2, vh - bm - bs, bs, dashStyle);
                  add("menu", "≡", vw - bm - bs, vh - bm - bs * 2 - bg, bs, menuStyle);
                  console.log("[VirtualControls] ready");
              }
              window.addEventListener("load", () => setTimeout(build, 200));
              let rt = null;
              window.addEventListener("resize", () => {
                  clearTimeout(rt);
                  rt = setTimeout(() => { if (root) { root.remove(); root = null; } build(); }, 300);
              });
          })();
          JSEOF

      - name: Patch plugins.js (robust, handles CRLF)
        run: |
          python3 << 'PYEOF'
          import re
          with open('www/js/plugins.js', 'r', encoding='utf-8') as f:
              content = f.read()
          if '"ForceCanvas"' not in content:
              content = re.sub(r'(\$plugins\s*=\s*)\[', r'\1[{"name":"ForceCanvas","status":true,"description":"","parameters":{}},', content, count=1)
          if '"VirtualControls"' not in content:
              idx = content.rfind('];')
              if idx != -1:
                  content = content[:idx] + ',{"name":"VirtualControls","status":true,"description":"","parameters":{}}' + content[idx:]
          content = content.replace('"name":"OrangeGreenworks","status":true', '"name":"OrangeGreenworks","status":false')
          with open('www/js/plugins.js', 'w', encoding='utf-8') as f:
              f.write(content)
          print('ForceCanvas present:', '"ForceCanvas"' in content)
          print('VirtualControls present:', '"VirtualControls"' in content)
          print('OrangeGreenworks disabled:', '"name":"OrangeGreenworks","status":false' in content)
          print()
          print(content[:400])
          PYEOF

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: npx cap init "Bad Bitch Blasters" "com.badbit.chblasters" --web-dir www

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android (landscape + fullscreen + cleartext)
        run: |
          python3 << 'PYEOF'
          import glob

          # --- 1. AndroidManifest: landscape + cleartext ---
          mpath = 'android/app/src/main/AndroidManifest.xml'
          with open(mpath, 'r', encoding='utf-8') as f:
              m = f.read()

          if 'usesCleartextTraffic' not in m:
              m = m.replace('<application', '<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"', 1)

          if 'android:screenOrientation' not in m:
              m = m.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"',
                  1
              )

          with open(mpath, 'w', encoding='utf-8') as f:
              f.write(m)
          print('manifest: cleartext=', 'usesCleartextTraffic' in m, ', screenOrientation=', 'screenOrientation' in m)

          # --- 2. styles.xml: fullscreen theme ---
          spath = 'android/app/src/main/res/values/styles.xml'
          with open(spath, 'r', encoding='utf-8') as f:
              s = f.read()

          if 'windowFullscreen' not in s:
              anchor = '<item name="windowActionBar">false</item>'
              if anchor in s:
                  s = s.replace(
                      anchor,
                      anchor + '\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowContentOverlay">@null</item>',
                      1
                  )
              with open(spath, 'w', encoding='utf-8') as f:
                  f.write(s)
          print('styles: windowFullscreen=', 'windowFullscreen' in s)

          # --- 3. MainActivity.java: immersive sticky ---
          paths = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          if not paths:
              print('ERROR: MainActivity.java not found')
          else:
              p = paths[0]
              print('Patching:', p)
              with open(p, 'r', encoding='utf-8') as f:
                  ma = f.read()

              if 'import android.view.View;' not in ma:
                  ma = ma.replace(
                      'import com.getcapacitor.BridgeActivity;',
                      'import com.getcapacitor.BridgeActivity;\nimport android.view.View;',
                      1
                  )

              if 'onWindowFocusChanged' not in ma:
                  idx = ma.rstrip().rfind('}')
                  method = '''
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN);
                  }
              }
          '''
                  ma = ma[:idx] + method + ma[idx:]

              with open(p, 'w', encoding='utf-8') as f:
                  f.write(ma)
              print('MainActivity: onWindowFocusChanged=', 'onWindowFocusChanged' in open(p).read())
              print('MainActivity: View import=', 'import android.view.View;' in open(p).read())
          PYEOF

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bbb-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
