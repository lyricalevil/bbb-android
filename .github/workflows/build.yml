name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download game
        run: |
          mkdir -p www
          wget -O game.zip "https://github.com/${{ github.repository }}/releases/download/v1/Bad.Bitch.Blasters.Build.23837192.zip"
          unzip -q game.zip -d www
          ls www/icon/ 2>&1 || true
          file www/icon/icon.png 2>&1 || true

      - name: Write ForceCanvas v7
        run: |
          PLUGINS_DIR=$(dirname "$(find www -name plugins.js 2>/dev/null | head -1)")
          cat > "$PLUGINS_DIR/plugins/ForceCanvas.js" <<'EOF'
          (() => {
              "use strict";
              function log(m) { console.log("[FC] " + m); }
              function err(m) { console.error("[FC] " + m); }
              log("v7 loaded");
              try { PIXI.settings.SCALE_MODE = PIXI.SCALE_MODES.NEAREST; } catch (e) {}
              try { PIXI.settings.MIPMAP_TEXTURES = PIXI.MIPMAP_MODES.OFF; } catch (e) {}
              try { PIXI.settings.ROUND_PIXELS = true; } catch (e) {}
              try {
                  if (PIXI.BaseTexture && PIXI.BaseTexture.defaultOptions) {
                      PIXI.BaseTexture.defaultOptions.scaleMode = PIXI.SCALE_MODES.NEAREST;
                      PIXI.BaseTexture.defaultOptions.mipmap = PIXI.MIPMAP_MODES.OFF;
                  }
              } catch (e) {}
              try {
                  if (typeof Bitmap !== "undefined" && Bitmap.prototype._createBaseTexture) {
                      const orig = Bitmap.prototype._createBaseTexture;
                      Bitmap.prototype._createBaseTexture = function (b) {
                          const bt = orig.call(this, b);
                          try { bt.scaleMode = PIXI.SCALE_MODES.NEAREST; bt.mipmap = PIXI.MIPMAP_MODES.OFF; bt.update(); } catch (e) {}
                          return bt;
                      };
                  }
              } catch (e) { err("Bitmap: " + e); }
              function retrofit() {
                  try {
                      const cache = PIXI.utils.TextureCache;
                      for (const k in cache) {
                          const t = cache[k];
                          if (t && t.baseTexture && t.baseTexture.scaleMode !== PIXI.SCALE_MODES.NEAREST) {
                              t.baseTexture.scaleMode = PIXI.SCALE_MODES.NEAREST;
                              t.baseTexture.update();
                          }
                      }
                  } catch (e) {}
              }
              setTimeout(retrofit, 500); setTimeout(retrofit, 1500);
              setTimeout(retrofit, 3000); setTimeout(retrofit, 6000);
              function fixLayout() {
                  const c = Graphics._canvas;
                  if (!c) return;
                  c.style.position = "absolute";
                  c.style.left = "0"; c.style.top = "0";
                  c.style.width = "100vw"; c.style.height = "100vh";
                  c.style.objectFit = "contain"; c.style.transform = "none";
                  c.style.background = "#000"; c.style.display = "block";
                  document.body.style.background = "#000";
                  document.body.style.margin = "0";
                  document.body.style.padding = "0";
                  document.body.style.overflow = "hidden";
              }
              try {
                  if (typeof Graphics !== "undefined" && Graphics._updateCanvas) {
                      const origUC = Graphics._updateCanvas.bind(Graphics);
                      Graphics._updateCanvas = function () { origUC(); fixLayout(); };
                  }
              } catch (e) {}
              window.addEventListener("resize", fixLayout);
              setTimeout(fixLayout, 100); setTimeout(fixLayout, 1000);
              function readSpeed() {
                  try { const raw = localStorage.getItem("vc_cfg"); if (raw) return JSON.parse(raw).speedX2 === true; } catch (e) {}
                  return false;
              }
              let speedOn = readSpeed();
              window.__vc_setSpeed = function (on) { speedOn = !!on; };
              try {
                  const origUpdate = SceneManager.update.bind(SceneManager);
                  const origUpdateInput = SceneManager.updateInputData.bind(SceneManager);
                  let skipInput = 0;
                  SceneManager.update = function (dt) {
                      origUpdate(dt);
                      if (speedOn) { skipInput++; origUpdate(dt); skipInput--; }
                  };
                  SceneManager.updateInputData = function () {
                      if (skipInput > 0) return;
                      origUpdateInput();
                  };
              } catch (e) { err("speed hook: " + e); }
          })();
          EOF

      - name: Write VirtualControls v3 (working panel + no auto-hide)
        run: |
          PLUGINS_DIR=$(dirname "$(find www -name plugins.js 2>/dev/null | head -1)")
          cat > "$PLUGINS_DIR/plugins/VirtualControls.js" <<'EOF'
          (() => {
              "use strict";
              const CFG_VERSION = 3;
              const DEFAULT = {
                  _version: CFG_VERSION,
                  opacity: 0.45,
                  scale: 1.0,
                  color: "#ffffff",
                  hideInMenu: false,
                  hideInMessage: false,
                  speedX2: false,
                  positions: null
              };
              function loadCfg() {
                  try {
                      const raw = localStorage.getItem("vc_cfg");
                      if (raw) {
                          const p = JSON.parse(raw);
                          if (p._version !== CFG_VERSION) {
                              return Object.assign({}, DEFAULT);
                          }
                          return Object.assign({}, DEFAULT, p, { _version: CFG_VERSION });
                      }
                  } catch (e) {}
                  return Object.assign({}, DEFAULT);
              }
              function saveCfg() {
                  CFG._version = CFG_VERSION;
                  try { localStorage.setItem("vc_cfg", JSON.stringify(CFG)); } catch (e) {}
              }

              let CFG = loadCfg();
              let root = null;
              let editMode = false;
              let panelOpen = false;
              let buttons = {};
              let settingsBtn = null;
              let panel = null;

              if (window.__vc_setSpeed) window.__vc_setSpeed(CFG.speedX2);

              function dbg(m) {
                  console.log("[VC] " + m);
              }

              function tryHideStatusBar() {
                  try {
                      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
                          window.Capacitor.Plugins.StatusBar.setOverlaysWebView({ overlay: true }).catch(()=>{});
                          window.Capacitor.Plugins.StatusBar.hide().catch(()=>{});
                      }
                  } catch (e) {}
              }
              tryHideStatusBar();
              setTimeout(tryHideStatusBar, 500);
              setTimeout(tryHideStatusBar, 2000);
              setTimeout(tryHideStatusBar, 5000);

              // --- Unified tap: touchstart + click, debounced ---
              function attachTap(el, callback) {
                  let last = 0;
                  const handler = (e) => {
                      if (e) { e.preventDefault(); e.stopPropagation(); }
                      const now = Date.now();
                      if (now - last < 250) return;
                      last = now;
                      try { callback(); } catch (err) { console.error("[VC] tap err:", err); }
                  };
                  el.addEventListener("touchstart", handler, { passive: false });
                  el.addEventListener("click", handler);
                  el.addEventListener("mousedown", handler);
              }

              function setKey(key, on) {
                  if (key === "mnu") {
                      if (on && SceneManager._scene instanceof Scene_Map && !$gameMessage.isBusy()) {
                          SceneManager._scene.callMenu();
                      }
                      return;
                  }
                  const map = { ok: "ok", no: "cancel", up: "up", down: "down", left: "left", right: "right" };
                  const ik = map[key];
                  if (!ik) return;
                  Input._currentState[ik] = on;
                  if (on) { Input._latestButton = ik; Input._pressedTime = 0; }
              }

              function parseColor(hex) {
                  hex = hex.replace('#', '');
                  if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
                  return { r: parseInt(hex.slice(0,2),16), g: parseInt(hex.slice(2,4),16), b: parseInt(hex.slice(4,6),16) };
              }
              function bgRgba(hex, a) {
                  const c = parseColor(hex);
                  return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
              }
              function isLight(hex) {
                  const c = parseColor(hex);
                  return (c.r * 0.299 + c.g * 0.587 + c.b * 0.114) > 150;
              }

              // --- VC buttons (game buttons) ---
              function makeButton(id, label, baseSize, circular) {
                  const el = document.createElement("div");
                  el.textContent = label;
                  el.dataset.vcid = id;
                  el.style.cssText = "position:fixed;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;font-family:'Courier New',monospace;font-weight:bold;z-index:2147483646;border-radius:" + (circular ? "50%" : "10px") + ";";
                  const start = (e) => {
                      e.preventDefault(); e.stopPropagation();
                      if (editMode) { startDrag(e, el, id); return; }
                      setKey(id, true);
                  };
                  const end = (e) => {
                      if (e) { e.preventDefault(); e.stopPropagation(); }
                      if (editMode) return;
                      setKey(id, false);
                  };
                  el.addEventListener("touchstart", start, { passive: false });
                  el.addEventListener("touchend", end, { passive: false });
                  el.addEventListener("touchcancel", end);
                  el.addEventListener("mousedown", start);
                  el.addEventListener("mouseup", end);
                  el.addEventListener("mouseleave", end);
                  return el;
              }

              function updateButtonStyle(el, id, baseSize) {
                  const sz = Math.round(baseSize * CFG.scale);
                  el.style.width = sz + "px";
                  el.style.height = sz + "px";
                  el.style.background = bgRgba(CFG.color, CFG.opacity);
                  el.style.border = "2px solid " + bgRgba(CFG.color, Math.min(1, CFG.opacity + 0.3));
                  el.style.color = isLight(CFG.color) ? "#000" : "#fff";
                  el.style.fontSize = Math.round(sz * 0.35) + "px";
                  el.style.outline = editMode ? "2px dashed #ff0" : "none";
              }

              let dragState = null;
              function startDrag(e, el, id) {
                  const t = (e.touches && e.touches[0]) || e;
                  const rect = el.getBoundingClientRect();
                  dragState = { el: el, id: id, offsetX: t.clientX - rect.left, offsetY: t.clientY - rect.top };
                  e.preventDefault();
              }
              document.addEventListener("touchmove", (e) => {
                  if (!dragState) return;
                  const t = e.touches[0];
                  dragState.el.style.left = (t.clientX - dragState.offsetX) + "px";
                  dragState.el.style.top = (t.clientY - dragState.offsetY) + "px";
                  e.preventDefault();
              }, { passive: false });
              document.addEventListener("mousemove", (e) => {
                  if (!dragState) return;
                  dragState.el.style.left = (e.clientX - dragState.offsetX) + "px";
                  dragState.el.style.top = (e.clientY - dragState.offsetY) + "px";
              });
              function endDrag() {
                  if (!dragState) return;
                  const rect = dragState.el.getBoundingClientRect();
                  const pct = { x: rect.left / innerWidth * 100, y: rect.top / innerHeight * 100 };
                  if (!CFG.positions) CFG.positions = {};
                  CFG.positions[dragState.id] = pct;
                  saveCfg();
                  dragState = null;
              }
              document.addEventListener("touchend", endDrag);
              document.addEventListener("mouseup", endDrag);

              function getPos(id) {
                  if (CFG.positions && CFG.positions[id]) return CFG.positions[id];
                  const dpad = 150;
                  const as = dpad / 3;
                  const margin = 30;
                  const btn = 68;
                  const baseL = margin / innerWidth * 100;
                  const baseT = (innerHeight - (dpad + margin)) / innerHeight * 100;
                  const asL = as / innerWidth * 100;
                  const asT = as / innerHeight * 100;
                  const btnL = (innerWidth - margin - btn) / innerWidth * 100;
                  const btnT = (innerHeight - margin - btn) / innerHeight * 100;
                  const stepL = (btn + 14) / innerWidth * 100;
                  switch (id) {
                      case "up":    return { x: baseL + asL, y: baseT };
                      case "down":  return { x: baseL + asL, y: baseT + asT * 2 };
                      case "left":  return { x: baseL, y: baseT + asT };
                      case "right": return { x: baseL + asL * 2, y: baseT + asT };
                      case "ok":    return { x: btnL, y: btnT };
                      case "no":    return { x: btnL - stepL, y: btnT };
                      case "mnu":   return { x: btnL - stepL * 2, y: btnT };
                      default: return { x: 50, y: 50 };
                  }
              }
              function applyPos(el, id) {
                  const p = getPos(id);
                  el.style.left = p.x + "%";
                  el.style.top = p.y + "%";
              }

              // --- Visibility: no auto-hide by default ---
              function updateVisibility() {
                  if (!root) return;
                  const s = SceneManager._scene;
                  if (!s) return;

                  let showDPad = true;
                  let showActions = true;
                  let showOK = true;

                  const isGameScene = (s instanceof Scene_Map) || (s instanceof Scene_Battle);

                  if (!isGameScene && CFG.hideInMenu) {
                      showDPad = false;
                      showActions = false;
                      showOK = true;
                  }
                  if (s instanceof Scene_Map && CFG.hideInMessage && $gameMessage.isBusy()) {
                      showDPad = false;
                      showActions = false;
                      showOK = false;
                  }

                  ["up","down","left","right"].forEach(id => {
                      if (buttons[id]) buttons[id].style.display = showDPad ? "flex" : "none";
                  });
                  ["no","mnu"].forEach(id => {
                      if (buttons[id]) buttons[id].style.display = showActions ? "flex" : "none";
                  });
                  if (buttons["ok"]) buttons["ok"].style.display = showOK ? "flex" : "none";
              }

              // --- Panel: buttons as divs with attachTap ---
              function makePanelBtn(label, callback, styleExtra) {
                  const d = document.createElement("div");
                  d.textContent = label;
                  d.style.cssText = "display:flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:6px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;font-size:14px;font-weight:bold;color:#fff;" + (styleExtra || "");
                  attachTap(d, callback);
                  return d;
              }

              function row(p, label, control) {
                  const r = document.createElement("div");
                  r.style.cssText = "margin-bottom:14px;display:flex;align-items:center;gap:10px;";
                  const l = document.createElement("div");
                  l.textContent = label;
                  l.style.cssText = "flex:0 0 150px;font-size:14px;color:#ddd;";
                  r.appendChild(l);
                  r.appendChild(control);
                  p.appendChild(r);
              }

              function buildPanel() {
                  const p = document.createElement("div");
                  p.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(90vw,520px);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(20,20,30,0.97);color:#fff;font-family:Arial,sans-serif;padding:20px;border-radius:12px;z-index:2147483647;box-shadow:0 4px 20px rgba(0,0,0,0.8);display:none;touch-action:pan-y;";

                  // Block touchstart from reaching MZ's document handler
                  p.addEventListener("touchstart", (e) => { e.stopPropagation(); }, { passive: true });

                  const title = document.createElement("div");
                  title.textContent = "Настройки управления v3";
                  title.style.cssText = "font-size:18px;font-weight:bold;margin-bottom:16px;text-align:center;";
                  p.appendChild(title);

                  // Opacity
                  const opIn = document.createElement("input");
                  opIn.type = "range";
                  opIn.min = "10"; opIn.max = "100"; opIn.step = "5";
                  opIn.value = Math.round(CFG.opacity * 100);
                  opIn.style.cssText = "flex:1;touch-action:manipulation;";
                  opIn.addEventListener("input", () => {
                      CFG.opacity = parseInt(opIn.value) / 100;
                      saveCfg(); applyStyles();
                  });
                  opIn.addEventListener("touchstart", (e) => { e.stopPropagation(); }, { passive: true });
                  row(p, "Прозрачность", opIn);

                  // Scale
                  const scIn = document.createElement("input");
                  scIn.type = "range";
                  scIn.min = "60"; scIn.max = "150"; scIn.step = "5";
                  scIn.value = Math.round(CFG.scale * 100);
                  scIn.style.cssText = "flex:1;touch-action:manipulation;";
                  scIn.addEventListener("input", () => {
                      CFG.scale = parseInt(scIn.value) / 100;
                      saveCfg(); applyStyles(); applyAllPositions();
                  });
                  scIn.addEventListener("touchstart", (e) => { e.stopPropagation(); }, { passive: true });
                  row(p, "Размер", scIn);

                  // Color
                  const cw = document.createElement("div");
                  cw.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;";
                  const colors = [
                      { name: "Белый", hex: "#ffffff" },
                      { name: "Чёрный", hex: "#202020" },
                      { name: "Красный", hex: "#d04040" },
                      { name: "Синий", hex: "#4060d0" },
                      { name: "Зелёный", hex: "#40a040" },
                      { name: "Жёлтый", hex: "#d0a020" }
                  ];
                  colors.forEach(c => {
                      const cb = document.createElement("div");
                      cb.style.cssText = "width:36px;height:36px;border-radius:50%;background:" + c.hex + ";cursor:pointer;border:3px solid " + (CFG.color === c.hex ? "#fff" : "transparent") + ";touch-action:manipulation;";
                      cb.title = c.name;
                      attachTap(cb, () => {
                          CFG.color = c.hex;
                          saveCfg(); applyStyles();
                          Array.from(cw.children).forEach(ch => ch.style.border = "3px solid transparent");
                          cb.style.border = "3px solid #fff";
                      });
                      cw.appendChild(cb);
                  });
                  row(p, "Цвет", cw);

                  // Toggles
                  function toggle(label, key, onChange) {
                      const b = makePanelBtn("", () => {}, "");
                      b.style.padding = "6px 16px";
                      b.style.minWidth = "80px";
                      function refresh() {
                          b.textContent = CFG[key] ? "ВКЛ" : "ВЫКЛ";
                          b.style.background = CFG[key] ? "#40a040" : "#606060";
                      }
                      refresh();
                      attachTap(b, () => {
                          CFG[key] = !CFG[key];
                          saveCfg(); refresh();
                          if (onChange) onChange();
                      });
                      row(p, label, b);
                  }
                  toggle("Скрывать в меню", "hideInMenu");
                  toggle("Скрывать в диалогах", "hideInMessage");
                  toggle("Ускорение x2", "speedX2", () => { if (window.__vc_setSpeed) window.__vc_setSpeed(CFG.speedX2); });

                  // Edit mode
                  const edBtn = makePanelBtn("", () => {});
                  edBtn.style.padding = "6px 16px";
                  function refreshEdit() {
                      edBtn.textContent = editMode ? "ГОТОВО" : "РАССТАВИТЬ";
                      edBtn.style.background = editMode ? "#d0a020" : "#4060d0";
                  }
                  refreshEdit();
                  attachTap(edBtn, () => {
                      editMode = !editMode;
                      refreshEdit();
                      applyStyles();
                  });
                  row(p, "Позиции кнопок", edBtn);

                  // Reset
                  const rsBtn = makePanelBtn("СБРОС", () => {
                      const vs = CFG.speedX2;
                      CFG = Object.assign({}, DEFAULT, { _version: CFG_VERSION });
                      saveCfg();
                      if (window.__vc_setSpeed) window.__vc_setSpeed(false);
                      applyStyles();
                      applyAllPositions();
                      // Reload panel to reflect new values
                      if (panel) { panel.remove(); panel = null; panelOpen = false; }
                  }, "background:#a02020;");
                  rsBtn.style.padding = "6px 16px";
                  row(p, "Сбросить всё", rsBtn);

                  // Close
                  const closeBtn = makePanelBtn("ЗАКРЫТЬ", () => {
                      panelOpen = false;
                      p.style.display = "none";
                  }, "background:#404060;width:100%;padding:12px;margin-top:8px;font-size:16px;");
                  p.appendChild(closeBtn);

                  document.body.appendChild(p);
                  return p;
              }

              function togglePanel() {
                  if (!panel) panel = buildPanel();
                  panelOpen = !panelOpen;
                  panel.style.display = panelOpen ? "block" : "none";
              }

              function applyStyles() {
                  if (!root) return;
                  const base = { up: 50, down: 50, left: 50, right: 50, ok: 68, no: 68, mnu: 68 };
                  for (const id in buttons) updateButtonStyle(buttons[id], id, base[id] || 68);
                  if (settingsBtn) {
                      const s = 40;
                      settingsBtn.style.width = s + "px";
                      settingsBtn.style.height = s + "px";
                      settingsBtn.style.fontSize = "20px";
                      settingsBtn.style.background = bgRgba(CFG.color, Math.min(0.8, CFG.opacity + 0.2));
                      settingsBtn.style.color = isLight(CFG.color) ? "#000" : "#fff";
                  }
              }
              function applyAllPositions() {
                  for (const id in buttons) applyPos(buttons[id], id);
              }

              function build() {
                  if (root) return;
                  root = document.createElement("div");
                  root.id = "vc-root";
                  root.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;z-index:2147483646;";
                  document.body.appendChild(root);

                  buttons.up = makeButton("up", "▲", 50, false);
                  buttons.down = makeButton("down", "▼", 50, false);
                  buttons.left = makeButton("left", "◀", 50, false);
                  buttons.right = makeButton("right", "▶", 50, false);
                  buttons.ok = makeButton("ok", "ok.", 68, true);
                  buttons.no = makeButton("no", "no.", 68, true);
                  buttons.mnu = makeButton("mnu", "mnu", 68, true);

                  for (const id in buttons) root.appendChild(buttons[id]);

                  settingsBtn = document.createElement("div");
                  settingsBtn.textContent = "⚙";
                  settingsBtn.style.cssText = "position:fixed;top:8px;right:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;z-index:2147483646;font-family:Arial;font-weight:bold;user-select:none;-webkit-user-select:none;touch-action:manipulation;";
                  attachTap(settingsBtn, togglePanel);
                  root.appendChild(settingsBtn);

                  applyStyles();
                  applyAllPositions();
                  updateVisibility();
                  setInterval(updateVisibility, 500);
                  dbg("ready");
              }

              window.addEventListener("load", () => setTimeout(build, 200));
              let rt = null;
              window.addEventListener("resize", () => {
                  clearTimeout(rt);
                  rt = setTimeout(() => { applyAllPositions(); applyStyles(); }, 300);
              });
          })();
          EOF

      - name: Patch plugins.js (JSON-safe)
        run: |
          python3 - <<'PYEOF'
          import re, glob, json
          p = glob.glob('www/**/plugins.js', recursive=True)[0]
          c = open(p, encoding='utf-8').read()
          m = re.search(r'(\$plugins\s*=\s*)(\[[\s\S]*\])(\s*;?\s*)$', c)
          if not m:
              print("ERROR: $plugins array not found"); raise SystemExit(1)
          prefix, arr_text, suffix = m.group(1), m.group(2), m.group(3) or ';'
          try:
              plugins = json.loads(arr_text)
          except Exception as e:
              print("ERROR: JSON parse failed:", e); raise SystemExit(1)
          before = len(plugins)
          plugins = [pl for pl in plugins if pl.get('name') not in ('ForceCanvas','VirtualControls')]
          print("Removed:", before - len(plugins))
          for pl in plugins:
              if pl.get('name') == 'OrangeGreenworks': pl['status'] = False
              if pl.get('name') == 'VisuMZ_0_CoreEngine':
                  params = pl.get('parameters', {})
                  qol = params.get('QoL:struct', '')
                  if isinstance(qol, str):
                      qol2 = qol.replace('"PixelateImageRendering:eval":"true"', '"PixelateImageRendering:eval":"false"')
                      if qol != qol2: params['QoL:struct'] = qol2
          plugins.append({"name":"VirtualControls","status":True,"description":"","parameters":{}})
          plugins.append({"name":"ForceCanvas","status":True,"description":"","parameters":{}})
          c_new = prefix + json.dumps(plugins, ensure_ascii=False) + ';'
          open(p, 'w', encoding='utf-8').write(c_new)
          print("Verify OK")
          PYEOF

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar

      - name: Init and add Android
        run: |
          npx cap init "Bad Bitch Blasters" "com.badbit.chblasters" --web-dir www
          npx cap add android

      - name: Set app icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 2>/dev/null || true
          python3 -m pip install --quiet Pillow
          python3 - <<'PYEOF'
          from PIL import Image
          import os, glob
          candidates = glob.glob("www/icon/icon.png") or glob.glob("www/**/icon.png", recursive=True)
          if not candidates:
              print("ERROR: icon.png not found"); raise SystemExit(1)
          src = candidates[0]
          print("Using:", src)
          img = Image.open(src).convert("RGBA")
          print("Source size:", img.size)
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          res = "android/app/src/main/res"
          for folder, size in sizes.items():
              fp = os.path.join(res, folder)
              os.makedirs(fp, exist_ok=True)
              r = img.resize((size, size), Image.LANCZOS)
              r.save(os.path.join(fp, "ic_launcher.png"), "PNG")
              r.save(os.path.join(fp, "ic_launcher_round.png"), "PNG")
              print(f"  {folder}: {size}x{size}")
          print("Icons OK")
          PYEOF

      - name: Patch Android
        run: |
          python3 - <<'PYEOF'
          import re, glob
          p = 'android/app/src/main/AndroidManifest.xml'
          m = open(p, encoding='utf-8').read()
          if 'usesCleartextTraffic' not in m:
              m = m.replace('<application', '<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"', 1)
          if 'screenOrientation' not in m:
              m = m.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"', 1)
          open(p, 'w', encoding='utf-8').write(m)
          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          def fix(mt):
              b = mt.group(0)
              if 'windowFullscreen' in b: return b
              return b.replace('</style>', '    <item name="android:windowFullscreen">true</item>\n</style>')
          s = re.sub(r'<style\b[^>]*>.*?</style>', fix, s, flags=re.DOTALL)
          open(p, 'w', encoding='utf-8').write(s)
          paths = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          if paths:
              p = paths[0]
              old = open(p, encoding='utf-8').read()
              pm = re.search(r'package\s+([\w.]+);', old)
              pkg = pm.group(1) if pm else 'com.badbit.chblasters'
              java = (
                'package ' + pkg + ';\n\n'
                'import android.graphics.Color;\n'
                'import android.os.Build;\n'
                'import android.os.Bundle;\n'
                'import android.os.Handler;\n'
                'import android.os.Looper;\n'
                'import android.view.WindowManager;\n'
                'import androidx.core.view.WindowCompat;\n'
                'import androidx.core.view.WindowInsetsCompat;\n'
                'import androidx.core.view.WindowInsetsControllerCompat;\n'
                'import com.getcapacitor.BridgeActivity;\n\n'
                'public class MainActivity extends BridgeActivity {\n'
                '    private final Handler handler = new Handler(Looper.getMainLooper());\n'
                '    private final Runnable hideRunnable = new Runnable() {\n'
                '        @Override public void run() { goFullscreen(); }\n'
                '    };\n\n'
                '    @Override\n'
                '    public void onCreate(Bundle s) {\n'
                '        super.onCreate(s);\n'
                '        WindowCompat.setDecorFitsSystemWindows(getWindow(), false);\n'
                '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {\n'
                '            getWindow().getAttributes().layoutInDisplayCutoutMode =\n'
                '                WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;\n'
                '        }\n'
                '        getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);\n'
                '        getWindow().setStatusBarColor(Color.TRANSPARENT);\n'
                '        getWindow().setNavigationBarColor(Color.TRANSPARENT);\n'
                '        goFullscreen();\n'
                '        handler.postDelayed(hideRunnable, 50);\n'
                '        handler.postDelayed(hideRunnable, 300);\n'
                '        handler.postDelayed(hideRunnable, 800);\n'
                '        handler.postDelayed(hideRunnable, 1500);\n'
                '        handler.postDelayed(hideRunnable, 3000);\n'
                '    }\n\n'
                '    @Override\n'
                '    public void onWindowFocusChanged(boolean has) {\n'
                '        super.onWindowFocusChanged(has);\n'
                '        if (has) goFullscreen();\n'
                '    }\n\n'
                '    @Override\n'
                '    public void onDestroy() {\n'
                '        super.onDestroy();\n'
                '        handler.removeCallbacks(hideRunnable);\n'
                '    }\n\n'
                '    private void goFullscreen() {\n'
                '        WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());\n'
                '        c.hide(WindowInsetsCompat.Type.systemBars());\n'
                '        c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);\n'
                '    }\n'
                '}\n'
              )
              open(p, 'w', encoding='utf-8').write(java)
          print("Android patches OK")
          PYEOF

      - name: Build
        run: |
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bbb-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
