                  makeActionBtn(secG.body, editMode ? "Перемещение: ВКЛ" : "Перемещение: ВЫКЛ", editMode ? "#d0a020" : "#4060d0", () => { editMode = !editMode; refreshAll(); });
                  makeActionBtn(secG.body, "ПОЛНЫЙ СБРОС", "#a02020", () => { try { localStorage.removeItem("vc_cfg"); } catch (e) {} location.reload(); });
                  const cb = document.createElement("div");
                  cb.style.cssText = "position:sticky;bottom:0;padding:10px 0 16px 0;margin-top:8px;background:linear-gradient(to top, rgba(20,20,30,1) 60%, rgba(20,20,30,0));";
                  const cl = document.createElement("div");
