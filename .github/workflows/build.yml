name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download game
        run: |
          mkdir -p www
          wget -O game.zip "https://github.com/${{ github.repository }}/releases/download/v1/Bad.Bitch.Blasters.Build.23837192.zip"
          unzip -q game.zip -d www
          if [ ! -f www/index.html ]; then
            inner=$(find www -maxdepth 2 -name index.html | head -1 | xargs dirname 2>/dev/null || true)
            if [ -n "$inner" ] && [ "$inner" != "www" ]; then
              shopt -s dotglob
              mv "$inner"/* www/
              rmdir "$inner" || true
            fi
          fi
          ls www | head

      - name: Write ForceCanvas plugin
        run: |
          cat > www/js/plugins/ForceCanvas.js <<'EOF'
          (() => {
              "use strict";
              if (typeof Graphics !== "undefined" && Graphics._createRenderer) {
                  Graphics._createRenderer = function () {
                      PIXI.dontSayHello = true;
                      try {
                          const r = new PIXI.CanvasRenderer(this._width, this._height, { view: this._canvas });
                          console.log("[ForceCanvas] Canvas OK");
                          return r;
                      } catch (e) {
                          console.error("[ForceCanvas] Canvas failed:", e);
                          return new PIXI.Renderer(this._width, this._height, { view: this._canvas });
                      }
                  };
              }
          })();
          EOF

      - name: Write VirtualControls plugin
        run: |
          cat > www/js/plugins/VirtualControls.js <<'EOF'
          (() => {
              "use strict";
              const CFG = { dpadSize: 150, dpadMargin: 30, btnSize: 68, btnMargin: 70, btnGap: 14, opacity: 0.45 };
              let root = null;
              function setKey(key, on) {
                  if (key === "menu") {
                      if (on && SceneManager._scene instanceof Scene_Map && !$gameMessage.isBusy()) {
                          SceneManager._scene.callMenu();
                      }
                      return;
                  }
                  Input._currentState[key] = on;
                  if (on) { Input._latestButton = key; Input._pressedTime = 0; }
              }
              function makeEl(id, label, style) {
                  const el = document.createElement("div");
                  el.textContent = label;
                  el.style.cssText = "position:fixed;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:none;font-family:Arial,sans-serif;font-weight:bold;color:#fff;z-index:2147483647;border-radius:50%;" + style;
                  const start = (e) => { e.preventDefault(); e.stopPropagation(); setKey(id, true); };
                  const end = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } setKey(id, false); };
                  el.addEventListener("touchstart", start, { passive: false });
                  el.addEventListener("touchend", end, { passive: false });
                  el.addEventListener("touchcancel", end);
                  el.addEventListener("mousedown", start);
                  el.addEventListener("mouseup", end);
                  el.addEventListener("mouseleave", end);
                  return el;
              }
              function build() {
                  if (root) return;
                  root = document.createElement("div");
                  root.id = "vc-root";
                  root.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;z-index:2147483647;";
                  document.body.appendChild(root);
                  const vw = innerWidth, vh = innerHeight;
                  const ds = CFG.dpadSize, dm = CFG.dpadMargin;
                  const as = ds / 3, dx = dm, dy = vh - ds - dm;
                  const arrowStyle = "background:rgba(255,255,255," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);border-radius:10px;font-size:24px;";
                  const add = (id, label, left, top, size, style) => {
                      const el = makeEl(id, label, style + "left:" + left + "px;top:" + top + "px;width:" + size + "px;height:" + size + "px;");
                      root.appendChild(el);
                  };
                  add("up", "▲", dx + as, dy, as, arrowStyle);
                  add("down", "▼", dx + as, dy + as * 2, as, arrowStyle);
                  add("left", "◀", dx, dy + as, as, arrowStyle);
                  add("right", "▶", dx + as * 2, dy + as, as, arrowStyle);
                  const bs = CFG.btnSize, bm = CFG.btnMargin, bg = CFG.btnGap;
                  const okStyle = "background:rgba(80,200,80," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  const cancelStyle = "background:rgba(200,80,80," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  const menuStyle = "background:rgba(80,80,200," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:26px;";
                  const dashStyle = "background:rgba(220,180,40," + CFG.opacity + ");border:2px solid rgba(255,255,255,0.8);font-size:22px;";
                  add("ok", "OK", vw - bm - bs, vh - bm - bs, bs, okStyle);
                  add("cancel", "X", vw - bm - bs * 2 - bg, vh - bm - bs, bs, cancelStyle);
                  add("shift", "⇧", vw - bm - bs * 3 - bg * 2, vh - bm - bs, bs, dashStyle);
                  add("menu", "≡", vw - bm - bs, vh - bm - bs * 2 - bg, bs, menuStyle);
              }
              window.addEventListener("load", () => setTimeout(build, 200));
              let rt = null;
              window.addEventListener("resize", () => {
                  clearTimeout(rt);
                  rt = setTimeout(() => { if (root) { root.remove(); root = null; } build(); }, 300);
              });
          })();
          EOF

      - name: Patch plugins.js
        run: |
          python3 - <<'PYEOF'
          import re
          with open('www/js/plugins.js', 'r', encoding='utf-8') as f:
              c = f.read()
          if '"ForceCanvas"' not in c:
              c = re.sub(r'(\$plugins\s*=\s*)\[', r'\1[{"name":"ForceCanvas","status":true,"description":"","parameters":{}},', c, count=1)
          else:
              c = re.sub(r'("name"\s*:\s*"ForceCanvas"\s*,\s*"status"\s*:\s*)false', r'\1true', c)
          if '"VirtualControls"' not in c:
              i = c.rfind('];')
              if i != -1:
                  c = c[:i] + ',{"name":"VirtualControls","status":true,"description":"","parameters":{}}' + c[i:]
          else:
              c = re.sub(r'("name"\s*:\s*"VirtualControls"\s*,\s*"status"\s*:\s*)false', r'\1true', c)
          c = re.sub(r'("name"\s*:\s*"OrangeGreenworks"\s*,\s*"status"\s*:\s*)true', r'\1false', c)
          with open('www/js/plugins.js', 'w', encoding='utf-8') as f:
              f.write(c)
          for n in ["ForceCanvas","VirtualControls","OrangeGreenworks"]:
              m = re.search(r'"name"\s*:\s*"' + n + r'"\s*,\s*"status"\s*:\s*(\w+)', c)
              print(n + ": " + (m.group(1) if m else "NOT FOUND"))
          PYEOF

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init and add Android
        run: |
          npx cap init "Bad Bitch Blasters" "com.badbit.chblasters" --web-dir www
          npx cap add android

      - name: Patch Android
        run: |
          python3 - <<'PYEOF'
          import re, glob
          p = 'android/app/src/main/AndroidManifest.xml'
          m = open(p, encoding='utf-8').read()
          if 'usesCleartextTraffic' not in m:
              m = m.replace('<application', '<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"', 1)
          if 'screenOrientation' not in m:
              m = m.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"', 1)
          open(p, 'w', encoding='utf-8').write(m)
          print('manifest done')

          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          def fix(mt):
              b = mt.group(0)
              if 'windowFullscreen' in b:
                  return b
              return b.replace('</style>', '    <item name="android:windowFullscreen">true</item>\n    <item name="android:windowContentOverlay">@null</item>\n    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n</style>')
          s = re.sub(r'<style\b[^>]*>.*?</style>', fix, s, flags=re.DOTALL)
          open(p, 'w', encoding='utf-8').write(s)
          print('styles done')

          paths = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          if paths:
              p = paths[0]
              old = open(p, encoding='utf-8').read()
              pm = re.search(r'package\s+([\w.]+);', old)
              pkg = pm.group(1) if pm else 'com.badbit.chblasters'
              java = 'package ' + pkg + ';\n'
              java += 'import android.os.Bundle;\n'
              java += 'import android.view.View;\n'
              java += 'import android.view.WindowManager;\n'
              java += 'import com.getcapacitor.BridgeActivity;\n\n'
              java += 'public class MainActivity extends BridgeActivity {\n'
              java += '    @Override\n'
              java += '    public void onCreate(Bundle s) {\n'
              java += '        super.onCreate(s);\n'
              java += '        getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);\n'
              java += '        hide();\n'
              java += '    }\n'
              java += '    @Override\n'
              java += '    public void onResume() {\n'
              java += '        super.onResume();\n'
              java += '        hide();\n'
              java += '    }\n'
              java += '    @Override\n'
              java += '    public void onWindowFocusChanged(boolean has) {\n'
              java += '        super.onWindowFocusChanged(has);\n'
              java += '        if (has) hide();\n'
              java += '    }\n'
              java += '    private void hide() {\n'
              java += '        getWindow().getDecorView().setSystemUiVisibility(\n'
              java += '            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY\n'
              java += '            | View.SYSTEM_UI_FLAG_LAYOUT_STABLE\n'
              java += '            | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION\n'
              java += '            | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN\n'
              java += '            | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION\n'
              java += '            | View.SYSTEM_UI_FLAG_FULLSCREEN);\n'
              java += '    }\n'
              java += '}\n'
              open(p, 'w', encoding='utf-8').write(java)
              print('MainActivity done')
          PYEOF

      - name: Build
        run: |
          npx cap sync android
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bbb-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
