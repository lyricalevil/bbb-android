name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download game zip
        run: |
          wget -O game.zip "https://github.com/${{ github.repository }}/releases/download/v1/bbb.zip"
          mkdir game
          unzip -q game.zip -d game

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Bad Bitch Blasters" "com.badbit.chblasters" --web-dir=www
          mkdir -p www
          cp -r game/* www/

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android config
        run: |
          # Разрешаем cleartext и file access
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bbb-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
